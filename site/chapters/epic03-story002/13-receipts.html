<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>拒绝执行之后，模型会收到什么？</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="13"><header class="page-header"><span>Zero2Agent • 消息配对</span><span class="page-number">13</span></header><div class="heading" data-block><h1>拒绝执行之后，<br>模型会收到什么？</h1><p class="deck" data-prose>每个 tool_use 都要有对应的 tool_result。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 846" width="952" height="846" role="img" aria-label="模型调用call-7被拒绝后生成相同tool_use_id的错误结果，进入下一轮请求，工具没有执行"><title>模型调用call-7被拒绝后生成相同tool_use_id的错误结果，进入下一轮请求，工具没有执行</title><defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#202622"/></marker><marker id="amuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555C55"/></marker><marker id="aline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CACDC3"/></marker><marker id="apaper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F4F1EA"/></marker><marker id="awhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFEF8"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28614D"/></marker><marker id="agreenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E0EBDF"/></marker><marker id="aamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerH 0"  /><text x="500" y="326" style="white-space:pre;font-size:38px;fill:#B53830;font-weight:650" text-anchor="middle" class="">权限拒绝</text><path class="edge" d="M651 313H817V381" stroke="#B53830"  /><path class="edge" d="M806 387l22 22 M828 387l-22 22" stroke="#B53830"  /><text x="817" y="448" style="white-space:pre;font-size:29px;fill:#B53830;font-weight:650" text-anchor="middle" class="">工具未执行</text><path class="edge" d="M476 357V464" stroke="#B53830" marker-end="url(#ared)" /><rect x="0" y="474" width="952" height="239" rx="12" fill="#202622" stroke="#202622" stroke-width="2" /><text x="30" y="521" style="white-space:pre;font-size:28px;fill:#F4F1EA;font-weight:600" text-anchor="start" class="">Harness → 下一次模型请求</text><text x="30" y="580" style="white-space:pre;font-size:38px;fill:#F4F1EA;font-weight:700" text-anchor="start" class="mono">tool_result</text><text x="30" y="634" style="white-space:pre;font-size:31px;fill:#F4F1EA;font-weight:500" text-anchor="start" class="mono">tool_use_id: "call-7"</text><text x="30" y="677" style="white-space:pre;font-size:29px;fill:#F3A599;font-weight:600" text-anchor="start" class="mono">is_error: true</text><text x="391" y="677" style="white-space:pre;font-size:27px;fill:#F3A599;font-weight:500" text-anchor="start" class="mono">原因: Permission denied</text><path class="edge" d="M851 168H935V474" stroke="#896016"  stroke-dasharray="7 8"/><path class="edge" d="M935 474V633H509" stroke="#E4C181"  stroke-dasharray="7 8"/><text x="860" y="241" style="white-space:pre;font-size:28px;fill:#896016;font-weight:650" text-anchor="middle" class="">同一 ID</text><path class="edge" d="M476 713V765" stroke="#202622" marker-end="url(#aink)" /><text x="476" y="821" style="white-space:pre;font-size:32px;fill:#202622;font-weight:600" text-anchor="middle" class="">模型知道：这次写入被拒绝，可以调整后续操作。</text></svg><p class="explain" data-prose data-block>拒绝原因与调用 ID 一起保留。工具没有运行，就不能给模型一个“写入成功”的结果；同批其它调用仍各自配对。</p></div></main></body></html>
