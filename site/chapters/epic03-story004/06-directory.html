<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>一个工作目录，一组自己的会话</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="06"><header class="page-header"><span>Zero2Agent · 磁盘结构</span><span class="page-number">06</span></header><div class="heading" data-block><h1>一个工作目录，<br>一组自己的会话</h1><p class="deck" data-prose>用 realpath 统一路径，再用 SHA-256 分组。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="目录树展示用户会话根目录下工作区哈希，再按UUID分目录，每个数字JSON是完整发布快照，点开头临时文件忽略"><title>目录树展示用户会话根目录下工作区哈希，再按UUID分目录，每个数字JSON是完整发布快照，点开头临时文件忽略</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="12" width="952" height="674" rx="12" fill="#202622" stroke="#202622" stroke-width="2" /><text x="30" y="69" fill="#F4F1EA" font-size="30" font-weight="400" text-anchor="start" class="mono">~/.zero2agent/sessions/</text><text x="30" y="144" fill="#F4F1EA" font-size="30" font-weight="400" text-anchor="start" class="mono">└─ &lt;工作区哈希&gt;/</text><text x="30" y="219" fill="#F4F1EA" font-size="30" font-weight="400" text-anchor="start" class="mono">   ├─ &lt;会话 UUID A&gt;/</text><text x="30" y="294" fill="#F4F1EA" font-size="30" font-weight="400" text-anchor="start" class="mono">   │  ├─ 1.json  ← pending</text><text x="30" y="369" fill="#F4F1EA" font-size="30" font-weight="400" text-anchor="start" class="mono">   │  ├─ 2.json  ← 已结算</text><text x="30" y="444" fill="#F4F1EA" font-size="30" font-weight="400" text-anchor="start" class="mono">   │  └─ .pending-…  ← 忽略</text><text x="30" y="519" fill="#F4F1EA" font-size="30" font-weight="400" text-anchor="start" class="mono">   └─ &lt;会话 UUID B&gt;/</text><text x="30" y="594" fill="#F4F1EA" font-size="30" font-weight="400" text-anchor="start" class="mono">      └─ 1.json</text><rect x="0" y="718" width="296" height="50" rx="25" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="148" y="753" fill="#28614D" font-size="28" font-weight="650" text-anchor="middle" >目录 0700</text><rect x="327" y="718" width="296" height="50" rx="25" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="475" y="753" fill="#28614D" font-size="28" font-weight="650" text-anchor="middle" >文件 0600</text><rect x="656" y="718" width="296" height="50" rx="25" fill="#F0E5C9" stroke="#896016" stroke-width="2" /><text x="804" y="753" fill="#896016" font-size="28" font-weight="650" text-anchor="middle" >单份 ≤ 32 MiB</text></svg><p class="explain" data-block data-prose>ZERO2AGENT_SESSION_DIR 可改根目录。会话仍按当前真实 cwd 隔离；本课不做跨工作区导入，也不把文件权限当成加密。</p></div></main></body></html>
