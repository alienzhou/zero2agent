<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>一份内存，两种状态：已保存，或仍待处理</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="16"><header class="page-header"><span>Zero2Agent · 保存失败</span><span class="page-number">16</span></header><div class="heading" data-block><h1>一份内存，两种状态：<br>已保存，或仍待处理</h1><p class="deck" data-prose>不要把输出回答，误当成磁盘已经写入。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="内存完整历史保存到磁盘时分成功失败两路，成功开放新轮，失败保留内存提示未保存并允许save重试；切换前也需要flush"><title>内存完整历史保存到磁盘时分成功失败两路，成功开放新轮，失败保留内存提示未保存并允许save重试；切换前也需要flush</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="157" y="9" width="638" height="112" rx="12" fill="#202622" stroke="#202622" stroke-width="2" /><text x="476" y="79" fill="#F4F1EA" font-size="40" font-weight="650" text-anchor="middle" >内存中：这一轮已结算</text><path d="M476 125V204" class="edge" stroke="#202622" marker-end="url(#ink)" /><circle cx="476" cy="280" r="73" fill="#FFFEF9" stroke="#202622" stroke-width="3"/><text x="476" y="291" fill="#202622" font-size="35" font-weight="650" text-anchor="middle" >保存</text><path d="M392 281H188V408" class="edge" stroke="#28614D" marker-end="url(#green)" /><path d="M560 281H765V408" class="edge" stroke="#B53830" marker-end="url(#red)" /><text x="223" y="250" fill="#28614D" font-size="31" font-weight="650" text-anchor="start" >成功</text><text x="650" y="250" fill="#B53830" font-size="31" font-weight="650" text-anchor="start" >失败</text><rect x="0" y="427" width="381" height="167" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="190" y="487" fill="#28614D" font-size="34" font-weight="650" text-anchor="middle" >已保存 r4</text><text x="190" y="549" fill="#28614D" font-size="34" font-weight="650" text-anchor="middle" >可以发送下一轮</text><rect x="572" y="427" width="380" height="167" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="762" y="487" fill="#B53830" font-size="34" font-weight="650" text-anchor="middle" >尚未保存</text><text x="762" y="549" fill="#B53830" font-size="34" font-weight="650" text-anchor="middle" >内存仍然保留</text><path d="M765 600V682H483V374" class="edge" stroke="#896016" marker-end="url(#amber)" /><text x="739" y="735" fill="#896016" font-size="30" font-weight="650" text-anchor="middle" >排除原因后 /save 重试</text><text x="0" y="743" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >切换前也要保存。</text></svg><p class="explain" data-block data-prose>磁盘满、权限错误、版本冲突分别处理。冲突不能靠盲目重试解决；正常退出保存失败会保留界面，崩溃与外部信号不能保证如此。</p></div></main></body></html>
