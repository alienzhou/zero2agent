<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>都从 r4 出发，谁能发布 r5？</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="09"><header class="page-header"><span>Zero2Agent · 两个写入者</span><span class="page-number">09</span></header><div class="heading" data-block><h1>都从 r4 出发，<br>谁能发布 r5？</h1><p class="deck" data-prose>把冲突拦在模型和工具执行之前。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="两个进程都读取r4后争抢同一个r5路径，A独占发布成功后运行，B收到EEXIST保留内存且不请求模型"><title>两个进程都读取r4后争抢同一个r5路径，A独占发布成功后运行，B收到EEXIST保留内存且不请求模型</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 1
