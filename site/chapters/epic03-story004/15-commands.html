<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>TUI、plain、单次调用，接到同一份会话逻辑</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet practice" data-page="15"><header class="page-header"><span>Zero2Agent · 命令入口</span><span class="page-number">15</span></header><div class="heading" data-block><h1>TUI、plain、单次调用，<br>接到同一份会话逻辑</h1><p class="deck" data-prose>自动保存行为一致，呈现方式适应各自的终端。</p></div><div class="content"><div class="terminal" data-block><p class="mini">生产 CLI · 需要当前模型配置才能续聊</p><pre>zero2agent --list-sessions
zero2agent --resume &lt;UUID&gt;
zero2agent --continue "接着讨论"
zero2agent --no-save</pre></div><svg class="diagram" viewBox="0 0 952 470" width="952" height="470" role="img" aria-label="命令映射中sessions负责列表resume负责恢复new新建save重试session查看状态；底部强调不恢复时默认新会话"><title>命令映射中sessions负责列表resume负责恢复new新建save重试session查看状态；底部强调不恢复时默认新会话</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><text x="0" y="42" fill="#B53830" font-size="32" font-weight="650" text-anchor="start" class="mono">/sessions</text><text x="385" y="42" fill="#202622" font-size="32" font-weight="500" text-anchor="start" >浏览当前工作区会话</text><path d="M0 76H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="135" fill="#B53830" font-size="32" font-weight="650" text-anchor="start" class="mono">/resume UUID</text><text x="385" y="135" fill="#202622" font-size="32" font-weight="500" text-anchor="start" >恢复指定会话</text><path d="M0 169H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="228" fill="#B53830" font-size="32" font-weight="650" text-anchor="start" class="mono">/new</text><text x="385" y="228" fill="#202622" font-size="32" font-weight="500" text-anchor="start" >新对话；旧记录仍在</text><path d="M0 262H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="321" fill="#B53830" font-size="32" font-weight="650" text-anchor="start" class="mono">/session /save</text><text x="385" y="321" fill="#202622" font-size="32" font-weight="500" text-anchor="start" >查看身份 / 重试保存</text><path d="M0 355H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="435" fill="#28614D" font-size="35" font-weight="650" text-anchor="start" >默认启动新会话；明确选择后才恢复。</text></svg><p class="explain" data-block data-prose>列表无需 API key。--no-save 为临时会话，不能同时恢复或列出；--plain、管道和 --terminal 入口继续保留。</p></div></main></body></html>
