<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>让两个进程，共享同一个对话事实</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet practice" data-page="18"><header class="page-header"><span>Zero2Agent · 动手跟练</span><span class="page-number">18</span></header><div class="heading" data-block><h1>让两个进程，<br>共享同一个对话事实</h1><p class="deck" data-prose>本地演示不需要 API key；读写路径使用生产代码。</p></div><div class="content"><div class="terminal" data-block><pre>pnpm install --frozen-lockfile

fY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><circle cx="35" cy="55" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="35" y="65" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >1</text><text x="91" y="67" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >A 保存并退出</text><text x="91" y="127" fill="#596057" font-size="32" font-weight="400" text-anchor="start" >“请记住 ALPHA-42。”</text><circle cx="35" cy="218" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="35" y="228" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >2</text><text x="91" y="230" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >B 找到会话 UUID</text><text x="91" y="290" fill="#596057" font-size="32" font-weight="400" text-anchor="start" >列表能看到标题与更新时间。</text><circle cx="35" cy="381" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="35" y="391" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >3</text><text x="91" y="393" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >恢复后再询问</text><text x="91" y="453" fill="#596057" font-size="32" font-weight="400" text-anchor="start" >“刚才的识别码是什么？”</text><text x="35" y="527" fill="#28614D" font-size="35" font-weight="650" text-anchor="start" >核对请求正文，再看实际回答。</text></svg><p class="explain" data-block data-prose>加 --tui 可体验会话选择器；演示结束后删除临时目录。真实服务补验另有记录，离线夹具通过不等于真实模型通过。</p></div></main></body></html>
