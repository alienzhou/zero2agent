<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>把要求写进文档，还要把检查接进程序</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="02"><header class="page-header"><span>Zero2Agent · 01 · 为什么还需要 Hook</span><span class="page-number">02</span></header><div class="heading" data-block><h1>把要求写进文档，<br>还要把检查接进程序</h1><p class="deck" data-prose>以只读配置 readonly.json 为例。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="项目规则技能与程序Hook各自负责的工作"><title>项目规则技能与程序Hook各自负责的工作</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="181" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="27" y="53" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >项目规则</text><text x="27" y="112" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >这个目录的约定</text><text x="345" y="112" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >配置文件不应被修改</text><rect x="0" y="220" width="952" height="181" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="27" y="273" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >Skills</text><text x="27" y="332" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >这类任务的步骤</text><text x="345" y="332" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >先改代码，再运行测试</text><rect x="0" y="440" width="952" height="181" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="27" y="493" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >Hooks</text><text x="27" y="552" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >执行时必须过的检查</text><text x="345" y="552" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >实际写入前阻止受保护路径</text></svg><p class="explain" data-block data-prose>自然语言约定由模型理解；Hook 在固定位置被宿主等待。Hook 只返回通过或阻止，不能批准宿主拒绝的操作。</p></div></main></body></html>
