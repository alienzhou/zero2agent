<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>发现配置不会执行，信任要指向当前代码</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="04"><header class="page-header"><span>Zero2Agent · 03 · 启用绑定具体版本</span><span class="page-number">04</span></header><div class="heading" data-block><h1>发现配置不会执行，<br>信任要指向当前代码</h1><p class="deck" data-prose>先查看身份，再明确启用；模型不能替用户点头。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="配置与脚本版本生成身份再由用户显式启用"><title>配置与脚本版本生成身份再由用户显式启用</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M0 0h390l40 40v160h-430Z" fill="#FFFEF9" stroke="#202622" stroke-width="3"/><path d="M390 0v40h40" fill="none" stroke="#202622" stroke-width="2"/><text x="22" y="75" fill="#202622" font-size="31" font-weight="700" text-anchor="start" >hooks.json</text><text x="22" y="132" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >command / argv / sources</text><text x="22" y="176" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >watch / stage</text><path d="M455 100H545" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><rect x="585" y="0" width="367" height="200" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="610" y="56" fill="#896016" font-size="34" font-weight="700" text-anchor="start" >当前版本身份</text><text x="610" y="114" fill="#202622" font-size="26" font-weight="400" text-anchor="start" >配置 + 可执行文件</text><text x="610" y="161" fill="#202622" font-size="26" font-weight="400" text-anchor="start" >脚本内容 + 物理身份</text><g data-terminal="0 290 952 184"><rect x="0" y="290" width="952" height="184" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="333" fill="#B8C8B9" font-size="25" font-weight="500" text-anchor="start" >CLI 的两个独立步骤</text><path d="M24 352h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="398" fill="#F4F1EA" font-size="27" font-weight="400" text-anchor="start" class="mono">--hooks-config /path/hooks.json --hooks</text><text x="24" y="447" fill="#F4F1EA" font-size="27" font-weight="400" text-anchor="start" class="mono">--hook-trust gate:&lt;identity&gt;</text></g><text x="0" y="574" fill="#B53830" font-size="34" font-weight="700" text-anchor="start" >配置或脚本变化 → 旧信任失效</text><text x="0" y="634" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >本轮不热切换到刚被修改的程序。</text></svg><p class="explain" data-block data-prose>命令绝对路径，参数不拼 shell，环境只显式传入。可信脚本具有宿主权限；版本核对不等于 OS 沙箱或通用回滚。</p></div></main></body></html>
