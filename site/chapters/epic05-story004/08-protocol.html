<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>控制 JSON 和诊断分开，正文与凭据不默认传入</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="08"><header class="page-header"><span>Zero2Agent · 07 · 小而明确的进程契约</span><span class="page-number">08</span></header><div class="heading" data-block><h1>控制 JSON 和诊断分开，<br>正文与凭据不默认传入</h1><p class="deck" data-prose>本节 JSON v1 是产品约定，不冒充跨产品通用标准。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="Hook输入元信息stdout控制JSON和stderr隔离"><title>Hook输入元信息stdout控制JSON和stderr隔离</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><g data-terminal="0 0 952 185"><rect x="0" y="0" width="952" height="185" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="43" fill="#B8C8B9" font-size="25" font-weight="500" text-anchor="start" >stdin · 最小元信息</text><path d="M24 62h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="108" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start" class="mono">stage / cwd / checkId</text><text x="24" y="157" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start" class="mono">tool 身份与路径 / 回执状态与摘要</text></g><g data-terminal="0 242 952 185"><rect x="0" y="242" width="952" height="185" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="285" fill="#B8C8B9" font-size="25" font-weight="500" text-anchor="start" >stdout · 严格控制响应</text><path d="M24 304h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="350" fill="#F4F1EA" font-size="27" font-weight="400" text-anchor="start" class="mono">{&quot;version&quot;:1,&quot;decision&quot;:&quot;pass&quot;}</text><text x="24" y="399" fill="#F4F1EA" font-size="27" font-weight="400" text-anchor="start" class="mono">或 decision:&quot;block&quot;；多余控制字段拒绝</text></g><rect x="0" y="490" width="952" height="149" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="25" y="545" fill="#B53830" font-size="31" font-weight="650" text-anchor="start" >stderr：排空并限额，不注入模型或日志</text><text x="25" y="600" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >无效 JSON、非零退出、超量和超时均停止。</text></svg><p class="explain" data-block data-prose>不默认传整段对话、工具正文、模型密钥或人工终端字节。检查次数、输入输出字节与时限独立有界，耗时仍受整轮预算约束。</p></div></main></body></html>
