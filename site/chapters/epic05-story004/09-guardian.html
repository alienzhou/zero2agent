<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>不能只恢复账本，还要终止留下的检查进程</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="09"><header class="page-header"><span>Zero2Agent · 08 · 宿主被强杀之后</span><span class="page-number">09</span></header><div class="heading" data-block><h1>不能只恢复账本，<br>还要终止留下的检查进程</h1><p class="deck" data-prose>真实 SIGKILL 不会执行宿主自己的 finally。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="管道守护进程在宿主死亡后终止真实Hook命令"><title>管道守护进程在宿主死亡后终止真实Hook命令</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="300" height="200" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="150" y="67" fill="#202622" font-size="34" font-weight="700" text-anchor="middle" >Agent 宿主</text><text x="150" y="132" fill="#202622" font-size="27" font-weight="400" text-anchor="middle" >等待检查</text><path d="M303 100h20" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><rect x="326" y="0" width="300" height="200" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="476" y="67" fill="#896016" font-size="34" font-weight="700" text-anchor="middle" >管道守护</text><text x="476" y="132" fill="#202622" font-size="27" font-weight="400" text-anchor="middle" >监测父管道 EOF</text><path d="M629 100h20" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><rect x="652" y="0" width="300" height="200" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="802" y="67" fill="#28614D" font-size="34" font-weight="700" text-anchor="middle" >真实 Hook</text><text x="802" y="132" fill="#202622" font-size="27" font-weight="400" text-anchor="middle" >运行固定程序</text><text x="0" y="298" fill="#B53830" font-size="34" font-weight="700" text-anchor="start" >① 宿主 SIGKILL，父管道关闭</text><path d="M35 326V380" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><text x="0" y="439" fill="#896016" font-size="34" font-weight="700" text-anchor="start" >② 守护进程终止检查进程组</text><path d="M35 467V521" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><text x="0" y="580" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >③ 恢复显示未知，不自动补跑</text></svg><p class="explain" data-block data-prose>正常结束、超时与取消也等待清理。实测按普通 POSIX 进程组检查 PID；主动逃离进程组和 Windows 后代清理不宣称已被覆盖。</p></div></main></body></html>
