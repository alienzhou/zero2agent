<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>检查通过也不能扩权，先批准再检查再写入</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="05"><header class="page-header"><span>Zero2Agent · 04 · 写入前的门</span><span class="page-number">05</span></header><div class="heading" data-block><h1>检查通过也不能扩权，<br>先批准再检查再写入</h1><p class="deck" data-prose>固定参数，不接收 Hook 返回的“改参数”或“自动批准”。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="权限门前置Hook与文件保护依次发生"><title>权限门前置Hook与文件保护依次发生</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="226" height="155" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="113" y="58" fill="#202622" font-size="33" font-weight="700" text-anchor="middle" >权限</text><text x="113" y="116" fill="#596057" font-size="24" font-weight="400" text-anchor="middle" >当前规则与审批</text><path d="M228 77h12" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><rect x="242" y="0" width="226" height="155" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="355" y="58" fill="#B53830" font-size="33" font-weight="700" text-anchor="middle" >前置 Hook</text><text x="355" y="116" fill="#596057" font-size="24" font-weight="400" text-anchor="middle" >pass / block</text><path d="M470 77h12" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><rect x="484" y="0" width="226" height="155" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="597" y="58" fill="#896016" font-size="33" font-weight="700" text-anchor="middle" >Checkpoint</text><text x="597" y="116" fill="#596057" font-size="24" font-weight="400" text-anchor="middle" >受控文件范围</text><path d="M712 77h12" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><rect x="726" y="0" width="226" height="155" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="839" y="58" fill="#28614D" font-size="33" font-weight="700" text-anchor="middle" >实际工具</text><text x="839" y="116" fill="#596057" font-size="24" font-weight="400" text-anchor="middle" >写入文件</text><path d="M0 254h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="320" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >宿主拒绝</text><text x="270" y="320" fill="#B53830" font-size="31" font-weight="400" text-anchor="start" >Hook 和工具都不启动</text><path d="M0 385h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="452" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >Hook 阻止</text><text x="270" y="452" fill="#B53830" font-size="31" font-weight="400" text-anchor="start" >工具效果为 0，批次停止</text><path d="M0 515h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="582" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >Hook 通过</text><text x="270" y="582" fill="#28614D" font-size="31" font-weight="400" text-anchor="start" >仍核对边界，再运行工具</text></svg><p class="explain" data-block data-prose>模型文件文本、服务 annotations、技能声明都不能授予这道门的权限。原文件保护接口继续在受控写入前等待完成。</p></div></main></body></html>
