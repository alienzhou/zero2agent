<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>恢复事实，不恢复进程或旧信任</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="10"><header class="page-header"><span>Zero2Agent · 09 · 恢复必要检查</span><span class="page-number">10</span></header><div class="heading" data-block><h1>恢复事实，<br>不恢复进程或旧信任</h1><p class="deck" data-prose>工具结算与检查开始、结算分别等待保存。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="工具事实检查义务和用户显式新检查的恢复时间线"><title>工具事实检查义务和用户显式新检查的恢复时间线</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M35 15V650" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><circle cx="35" cy="45" r="8" fill="#28614D"/><text x="80" y="49" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >保存工具回执</text><text x="80" y="98" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >同时记下 afterTool 尚未开始</text><circle cx="35" cy="210" r="8" fill="#896016"/><text x="80" y="214" fill="#896016" font-size="34" font-weight="700" text-anchor="start" >保存 Hook 启动意图</text><text x="80" y="263" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >再启动进程；中断后视为未知</text><circle cx="35" cy="375" r="8" fill="#202622"/><text x="80" y="379" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >恢复会话，展示两本账</text><text x="80" y="428" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >旧工具和旧 Hook 都不自动重放</text><circle cx="35" cy="540" r="8" fill="#28614D"/><text x="80" y="544" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >用户核对并授权新检查</text><text x="80" y="593" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >旧失败保留，新检查有独立 ID</text></svg><p class="explain" data-block data-prose>使用 /recovery check &lt;核对说明&gt;，再明确 continue。脚本改动需重新查看并信任当前版本；显式新检查关联旧记录，不能悄悄删除必要检查。</p></div></main></body></html>
