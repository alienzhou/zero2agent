<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>前置可以阻止，后置保留已经发生的事实</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="03"><header class="page-header"><span>Zero2Agent · 02 · 三处同步检查点</span><span class="page-number">03</span></header><div class="heading" data-block><h1>前置可以阻止，<br>后置保留已经发生的事实</h1><p class="deck" data-prose>展示通知继续负责界面，等待式控制接口负责执行。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="从授权到工具结果再到最终完成的同步检查顺序"><title>从授权到工具结果再到最终完成的同步检查顺序</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M45 20V650" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><circle cx="45" cy="40" r="8" fill="#202622"/><text x="87" y="45" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >当前权限批准</text><text x="87" y="91" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >未获批准就不运行工具前置 Hook</text><circle cx="45" cy="168" r="8" fill="#28614D"/><text x="87" y="173" fill="#28614D" font-size="33" font-weight="700" text-anchor="start" >beforeTool → 文件 Checkpoint</text><text x="87" y="219" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >检查通过，才进入受控写入</text><circle cx="45" cy="296" r="8" fill="#202622"/><text x="87" y="301" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >工具执行 → 保存真实回执</text><text x="87" y="347" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >真实结果与后置待检查义务一起保存</text><circle cx="45" cy="424" r="8" fill="#B53830"/><text x="87" y="429" fill="#B53830" font-size="33" font-weight="700" text-anchor="start" >afterTool</text><text x="87" y="475" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >失败就停后续调用，原回执不改写</text><circle cx="45" cy="552" r="8" fill="#28614D"/><text x="87" y="557" fill="#28614D" font-size="33" font-weight="700" text-anchor="start" >beforeComplete → 原完成校验</text><text x="87" y="603" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >检查与产物门槛共同决定完成</text></svg><p class="explain" data-block data-prose>前置失败配对为未执行；后置失败说明“工具已执行，检查失败”。Hook 自身不会递归触发另一轮 Hook。</p></div></main></body></html>
