or="start" >流式校验完整 SHA-256</text><path d="M355 272H579" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="615" y="217" width="337" height="139" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="638" y="271" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >≤ 4096 字节</text><text x="638" y="321" fill="#28614D" font-size="27" font-weight="400" text-anchor="start" >回给模型的这一页</text><path d="M0 425h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="494" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >不再生成第二份 chunks.jsonl。</text><text x="0" y="556" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >每次读取会顺序校验整份正文；</text><text x="0" y="618" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >省的是返回正文和内存，未承诺常数磁盘 I/O。</text></svg><p class="explain" data-block data-prose>每份正文最多 16 MiB，校验途中也检查取消与文件增长。完整校验有成本；读者应理解这个取舍。</p></div></main></body></html>
