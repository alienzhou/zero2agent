<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>恢复会话，需要两部分数据</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="12"><header class="page-header"><span>Zero2Agent · 11 · 关掉程序之后</span><span class="page-number">12</span></header><div class="heading" data-block><h1>恢复会话，<br>需要两部分数据</h1><p class="deck" data-prose>本机快照中的引用，还要找到对应正文。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="会话JSON只存配对历史与引用元信息，正文在结果目录；新进程联接二者但不重放工具"><title>会话JSON只存配对历史与引用元信息，正文在结果目录；新进程联接二者但不重放工具</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M0 0h385l44 44v246h-429Z" fill="#FFFEF9" stroke="#28614D" stroke-width="3"/><path d="M385 0v44h44" fill="none" stroke="#28614D" stroke-width="2"/><text x="22" y="87" fill="#28614D" font-size="30" font-weight="700" text-anchor="start" >会话 JSON</text><text x="22" y="149" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >调用与结果配对</text><text x="22" y="194" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >结果目录身份</text><text x="22" y="239" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >引用、来源、SHA-256</text><path d="M523 0h385l44 44v246h-429Z" fill="#FFFEF9" stroke="#28614D" stroke-width="3"/><path d="M908 0v44h44" fill="none" stroke="#28614D" stroke-width="2"/><text x="545" y="87" fill="#28614D" font-size="30" font-weight="700" text-anchor="start" >本机结果目录</text><text x="545" y="149" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >私有正文文件</text><text x="545" y="194" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >按工作区与会话隔离</text><text x="545" y="239" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >不含旧审批或旧进程</text><path d="M214 321V380H476V432" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><path d="M737 321V380H476" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round"  /><text x="251" y="497" fill="#28614D" font-size="44" font-weight="700" text-anchor="start" >新 CLI 进程</text><text x="88" y="559" fill="#202622" font-size="32" font-weight="400" text-anchor="start" >校验快照 → 当前权限 → 校验正文 → 回读</text><path d="M0 605h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="654" fill="#B53830" font-size="29" font-weight="650" text-anchor="start" >只复制 JSON 到另一台电脑，不等于迁移了正文。</text></svg><p class="explain" data-block data-prose>不同工作区恢复会明确拒绝原引用。恢复失败保留当前会话；原工具不因读取需要而自动执行。</p></div></main></body></html>
