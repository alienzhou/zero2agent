<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>已有落盘，这一课补读取契约</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="03"><header class="page-header"><span>Zero2Agent · 02 · 与终端那课的区别</span><span class="page-number">03</span></header><div class="heading" data-block><h1>已有落盘，<br>这一课补读取契约</h1><p class="deck" data-prose>先确认已有能力，避免再做一遍同样的功能。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="三层能力时间线：终端输出收集、上下文缩短、统一结果引用与回读"><title>三层能力时间线：终端输出收集、上下文缩短、统一结果引用与回读</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M33 32V583" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round"  /><circle cx="33" cy="65" r="11" fill="#202622"/><text x="79" y="72" fill="#202622" font-size="31" font-weight="700" text-anchor="start" >E02-S003</text><text x="79" y="134" fill="#202622" font-size="35" font-weight="650" text-anchor="start" >终端输出过长 → 流式写文件</text><text x="79" y="190" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >解决一个输出生产者的收集问题。</text><circle cx="33" cy="277" r="11" fill="#896016"/><text x="79" y="284" fill="#896016" font-size="31" font-weight="700" text-anchor="start" >E03-S001</text><text x="79" y="346" fill="#202622" font-size="35" font-weight="650" text-anchor="start" >上下文紧张 → 正文换临时路径</text><text x="79" y="402" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >原史保留，发送视图变短。</text><circle cx="33" cy="489" r="11" fill="#28614D"/><text x="79" y="496" fill="#28614D" font-size="31" font-weight="700" text-anchor="start" >E04-S002</text><text x="79" y="558" fill="#202622" font-size="35" font-weight="650" text-anchor="start" >引用 → 权限检查 → 按字节回读</text><text x="79" y="614" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >终端、文件、搜索共用结果存储。</text></svg><p class="explain" data-block data-prose>本课仍复用终端 OutputSink。旧会话的大正文保留原史；新工具的大结果进入历史前就换成引用。</p></div></main></body></html>
