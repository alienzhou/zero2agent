<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>过去读到过，不代表现在永远能读</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="10"><header class="page-header"><span>Zero2Agent · 09 · 重新检查读取权限</span><span class="page-number">10</span></header><div class="heading" data-block><h1>过去读到过，<br>不代表现在永远能读</h1><p class="deck" data-prose>来源路径由 Harness 保存，模型不能替换成另一条路径。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="三条权限路径：工作区内只读允许、外部原来源重新审批、显式拒绝不返回正文"><title>三条权限路径：工作区内只读允许、外部原来源重新审批、显式拒绝不返回正文</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="44" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >工作区内来源</text><text x="0" y="99" fill="#596057" font-size="28" font-weight="400" text-anchor="start" class="mono">read-only</text><path d="M394 66H648" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="685" y="34" width="267" height="48" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="700" y="67" fill="#28614D" font-size="26" font-weight="650" text-anchor="start" >允许读取结果</text><path d="M0 146h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="228" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >工作区外来源</text><text x="0" y="283" fill="#596057" font-size="28" font-weight="400" text-anchor="start" class="mono">default</text><path d="M394 250H648" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><rect x="685" y="218" width="267" height="48" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="700" y="251" fill="#896016" font-size="26" font-weight="650" text-anchor="start" >需要当前审批</text><path d="M0 330h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="412" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >显式 deny 规则</text><text x="0" y="467" fill="#596057" font-size="28" font-weight="400" text-anchor="start" class="mono">read_tool_result</text><path d="M394 434H648" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><rect x="685" y="402" width="267" height="48" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="700" y="435" fill="#B53830" font-size="26" font-weight="650" text-anchor="start" >拒绝返回正文</text><path d="M0 514h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="632" fill="#202622" font-size="32" font-weight="650" text-anchor="start" >快照保存事实与引用，不保存旧审批。</text></svg><p class="explain" data-block data-prose>来源按当时的真实路径记录；删除工作区内的软链接，也不能把外部数据变成内部来源。终端结果的读取不授权执行命令。</p></div></main></body></html>
