<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>300 KB 的输出，不用每轮都重新发送</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="06"><header class="page-header"><span>Zero2Agent · 05 · 限制每次带入的正文</span><span class="page-number">06</span></header><div class="heading" data-block><h1>300 KB 的输出，<br>不用每轮都重新发送</h1><p class="deck" data-prose>存储阈值、读取上限、上下文预算是三道检查。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="不同数量级的大小条，标注不按比例；完整正文大于20KiB转引用，回读4096字节，再过模型输入预算"><title>不同数量级的大小条，标注不按比例；完整正文大于20KiB转引用，回读4096字节，再过模型输入预算</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="42" fill="#202622" font-size="32" font-weight="700" text-anchor="start" >原始正文 · 示例 300 KB</text><rect x="0" y="76" width="952" height="94" rx="0" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="137" fill="#F4F1EA" font-size="31" font-weight="400" text-anchor="start" >保存在本机结果存储</text><text x="0" y="249" fill="#B53830" font-size="33" font-weight="700" text-anchor="start" >超过 20 KiB → 新结果换成短引用</text><path d="M470 277V335" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><rect x="0" y="356" width="420" height="97" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="23" y="418" fill="#28614D" font-size="31" font-weight="700" text-anchor="start" >每页最多 4096 字节</text><text x="481" y="398" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >只读需要的范围</text><text x="481" y="445" fill="#596057" font-size="27" font-weight="400" text-anchor="start" >JSON 转义还会增加长度</text><path d="M0 515h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="577" fill="#202622" font-size="30" font-weight="650" text-anchor="start" >发送前：完整请求再次经过 ContextBudget</text><text x="0" y="630" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >有界回读降低压力，但不能绕过输入预算。</text></svg><p class="explain" data-block data-prose>条形图不按比例。4096 是正文原始字节上限，不是 token 数，也不是含来源元信息的整份 JSON 长度。</p></div></main></body></html>
