 y="496" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >实际返回：A中</text><text x="24" y="548" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >next_offset = 4；下一页从完整字符开始。</text><text x="0" y="643" fill="#B53830" font-size="27" font-weight="650" text-anchor="start" >手填 offset 落在字符中间 → INVALID_RESULT_RANGE</text></svg><p class="explain" data-block data-prose>offset 从 0 开始，limit 必须是 4–4096 的整数。原始终端字节可能不是 UTF-8，此时另附 raw_base64 保留实际字节。</p></div></main></body></html>
