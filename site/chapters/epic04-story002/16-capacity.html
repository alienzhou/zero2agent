<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>保存大结果，也要有容量上限</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="16"><header class="page-header"><span>Zero2Agent · 15 · 给存储设边界</span><span class="page-number">16</span></header><div class="heading" data-block><h1>保存大结果，<br>也要有容量上限</h1><p class="deck" data-prose>不能为了节省上下文，把风险转移给磁盘与队列。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="单份16MiB、会话64MiB、128引用三项额度，数据流背压与过限排空机制"><title>单份16MiB、会话64MiB、128引用三项额度，数据流背压与过限排空机制</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="126" fill="#B53830" font-size="95" font-weight="700" text-anchor="start" >16</text><text x="0" y="207" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >MiB</text><text x="0" y="270" fill="#202622" font-size="33" font-weight="650" text-anchor="start" >单份正文</text><text x="332" y="126" fill="#B53830" font-size="95" font-weight="700" text-anchor="start" >64</text><text x="332" y="207" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >MiB</text><text x="332" y="270" fill="#202622" font-size="33" font-weight="650" text-anchor="start" >会话正文</text><text x="666" y="126" fill="#B53830" font-size="95" font-weight="700" text-anchor="start" >128</text><text x="666" y="207" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >条</text><text x="666" y="270" fill="#202622" font-size="33" font-weight="650" text-anchor="start" >会话引用</text><path d="M0 302h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="364" fill="#202622" font-size="32" font-weight="650" text-anchor="start" >终端流：写盘跟不上 → 暂停读取管道</text><path d="M92 421H861" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><rect x="0" y="453" width="245" height="48" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="15" y="486" fill="#202622" font-size="26" font-weight="650" text-anchor="start" >stdout / stderr</text><rect x="356" y="453" width="245" height="48" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="371" y="486" fill="#896016" font-size="26" font-weight="650" text-anchor="start" >有界写入队列</text><rect x="708" y="453" width="244" height="48" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="723" y="486" fill="#28614D" font-size="26" font-weight="650" text-anchor="start" >私有正文文件</text><text x="0" y="581" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >超过单份容量：继续排空进程，明确输出不完整。</text><text x="0" y="634" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >活跃结果不会为了腾空间被静默删除。</text></svg><p class="explain" data-block data-prose>容量也包括执行前的输出预留；短命令结束释放，后台关闭后按实际大小计入。全机所有会话没有总配额。</p></div></main></body></html>
