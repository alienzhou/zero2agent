<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>文件还在增长，不能说它已经完整封存</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="15"><header class="page-header"><span>Zero2Agent · 14 · 终端仍在运行时</span><span class="page-number">15</span></header><div class="heading" data-block><h1>文件还在增长，<br>不能说它已经完整封存</h1><p class="deck" data-prose>后台日志与已结算结果有不同的读取语义。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="前台结束的输出进入封存引用，后台跳过输出仍为未封存路径，没有固定哈希"><title>前台结束的输出进入封存引用，后台跳过输出仍为未封存路径，没有固定哈希</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="54" fill="#28614D" font-size="38" font-weight="700" text-anchor="start" >进程已结算</text><path d="M274 41H425" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="469" y="54" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >关闭流 → 封存 → 引用</text><rect x="0" y="101" width="952" height="141" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="24" y="153" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >有固定字节数和 SHA-256。</text><text x="24" y="206" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >取消或 drain 超时的回执仍说明输出可能不完整。</text><path d="M0 302h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="369" fill="#896016" font-size="38" font-weight="700" text-anchor="start" >Ctrl-S 转后台</text><path d="M335 356H489" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><text x="532" y="369" fill="#896016" font-size="34" font-weight="700" text-anchor="start" >仍在写入</text><rect x="0" y="416" width="952" height="143" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="24" y="468" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >回执明确标记 unsealed，保留原日志路径。</text><text x="24" y="521" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >读取路径需要当前文件权限；不伪造已完成引用。</text><text x="0" y="642" fill="#202622" font-size="29" font-weight="650" text-anchor="start" >人工终端的私密字节，继续不记录、不发给模型。</text></svg><p class="explain" data-block data-prose>后台完成通知沿用既有机制。本课没有把活跃进程变成可恢复任务，也没有将人工输入纳入结果存储。</p></div></main></body></html>
