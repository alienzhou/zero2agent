<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>写入队列需要上限，失败还必须看得见</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="12"><header class="page-header"><span>Zero2Agent · 日志失败不拖垮任务</span><span class="page-number">12</span></header><div class="heading" data-block><h1>写入队列需要上限，<br>失败还必须看得见</h1><p class="deck" data-prose>接受一条记录之后，尽力保留已接受的完整前缀。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="元信息经过投影到有界队列，异步顺序写入并flush，预算超限或IO失败转入可见降级状态但任务继续"><title>元信息经过投影到有界队列，异步顺序写入并flush，预算超限或IO失败转入可见降级状态但任务继续</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="75" width="282" height="101" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="141" y="138" fill="#28614D" font-size="33" font-weight="700" text-anchor="middle" >白名单投影</text><rect x="335" y="75" width="282" height="101" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="476" y="138" fill="#28614D" font-size="33" font-weight="700" text-anchor="middle" >有界队列</text><rect x="670" y="75" width="282" height="101" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="811" y="138" fill="#28614D" font-size="33" font-weight="700" text-anchor="middle" >顺序写入</text><path d="M295 124H320" class="edge" stroke="#28614D" marker-end="url(#green)" /><path d="M630 124H655" class="edge" stroke="#28614D" marker-end="url(#green)" /><path d="M476 190V313" class="edge" stroke="#B53830" marker-end="url(#red)" /><text x="521" y="250" fill="#B53830" font-size="30" font-weight="600" text-anchor="start" >上限 / I/O 失败</text><rect x="0" y="333" width="952" height="162" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="29" y="393" fill="#B53830" font-size="38" font-weight="700" text-anchor="start" >日志不可用 · 停止接受新记录</text><text x="29" y="455" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >TUI 保持提示；plain 路径写到 stderr。</text><path d="M811 190V566" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="500" y="587" width="452" height="173" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="527" y="645" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >flush → fsync</text><text x="527" y="707" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >操作收尾 / 正常退出</text><rect x="0" y="587" width="432" height="173" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="28" y="645" fill="#202622" font-size="38" font-weight="700" text-anchor="start" >任务继续</text><text x="28" y="707" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >诊断错误不替代任务结果</text></svg><p class="explain" data-block data-prose>队列或文件预算拒绝后续记录，已接受队列仍会写完；实际 I/O 失败可能只留下前缀。fsync 不构成工具执行事务。</p></div></main></body></html>
