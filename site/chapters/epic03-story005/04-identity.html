<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>同名工具调用，怎样找到它的请求？</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="04"><header class="page-header"><span>Zero2Agent · 关联身份</span><span class="page-number">04</span></header><div class="heading" data-block><h1>同名工具调用，<br>怎样找到它的请求？</h1><p class="deck" data-prose>关联关系要在调用开始时确定。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="进程run包含两个操作，同一个session跨进程；每个operation包含自己的request与相同toolCallId，组合身份可以区分"><title>进程run包含两个操作，同一个session跨进程；每个operation包含自己的request与相同toolCallId，组合身份可以区分</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><text x="0" y="45" fill="#596057" font-size="33" font-weight="400" text-anchor="start" >session：跨进程的对话身份</text><rect x="0" y="95" width="952" height="653" rx="12" fill="#FFFEF9" stroke="#202622" stroke-width="2" /><text x="27" y="149" fill="#202622" font-size="35" font-weight="700" text-anchor="start" >run UUID · 本次进程的日志文件</text><rect x="24" y="204" width="420" height="468" rx="12" fill="#E7EADF" stroke="#C9CDC2" stroke-width="2" /><text x="49" y="267" fill="#202622" font-size="35" font-weight="700" text-anchor="start" >operation A</text><path d="M232 295V342" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="49" y="360" width="370" height="78" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="69" y="410" fill="#28614D" font-size="31" font-weight="650" text-anchor="start" >request A1</text><path d="M232 450V497" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="49" y="516" width="370" height="103" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="69" y="558" fill="#202622" font-size="27" font-weight="600" text-anchor="start" >toolCallId: tool_1</text><text x="69" y="597" fill="#596057" font-size="26" font-weight="400" text-anchor="start" >toolName: read_file</text><rect x="508" y="204" width="420" height="468" rx="12" fill="#E7EADF" stroke="#C9CDC2" stroke-width="2" /><text x="533" y="267" fill="#202622" font-size="35" font-weight="700" text-anchor="start" >operation B</text><path d="M716 295V342" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="533" y="360" width="370" height="78" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="553" y="410" fill="#28614D" font-size="31" font-weight="650" text-anchor="start" >request B1</text><path d="M716 450V497" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="533" y="516" width="370" height="103" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="553" y="558" fill="#202622" font-size="27" font-weight="600" text-anchor="start" >toolCallId: tool_1</text><text x="553" y="597" fill="#596057" font-size="26" font-weight="400" text-anchor="start" >toolName: read_file</text></svg><p class="explain" data-block data-prose>run + operation + request + toolCallId 共同定位调用。只看工具名或模型给出的 toolCallId，可能把不同轮次混在一起。</p></div></main></body></html>
