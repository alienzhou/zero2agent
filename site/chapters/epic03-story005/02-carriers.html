<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>保存会话、显示状态、记录日志各解决什么？</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="02"><header class="page-header"><span>Zero2Agent · 先分清用途</span><span class="page-number">02</span></header><div class="heading" data-block><h1>保存会话、显示状态、<br>记录日志各解决什么？</h1><p class="deck" data-prose>同一个 Agent，需要三种不同的数据载体。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="会话快照保存对话与摘要，TUI提供当场控制，运行日志留下请求和结果的元信息"><title>会话快照保存对话与摘要，TUI提供当场控制，运行日志留下请求和结果的元信息</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><circle cx="30" cy="108" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="30" y="118" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >1</text><text x="92" y="113" fill="#202622" font-size="43" font-weight="700" text-anchor="start" >会话快照</text><text x="92" y="178" fill="#202622" font-size="32" font-weight="400" text-anchor="start" >原始历史 + 已采用摘要</text><rect x="92" y="220" width="510" height="50" rx="25" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="347" y="255" fill="#28614D" font-size="28" font-weight="650" text-anchor="middle" >重启后接着聊</text><circle cx="30" cy="357" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="30" y="367" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >2</text><text x="92" y="362" fill="#28614D" font-size="43" font-weight="700" text-anchor="start" >TUI 屏幕</text><text x="92" y="427" fill="#202622" font-size="32" font-weight="400" text-anchor="start" >当前阶段 + 输入 + 审批</text><rect x="92" y="469" width="510" height="50" rx="25" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="347" y="504" fill="#28614D" font-size="28" font-weight="650" text-anchor="middle" >当场观察和控制</text><circle cx="30" cy="605" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="30" y="615" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >3</text><text x="92" y="610" fill="#B53830" font-size="43" font-weight="700" text-anchor="start" >运行日志</text><text x="92" y="675" fill="#202622" font-size="32" font-weight="400" text-anchor="start" >身份 + 起止 + 耗时 + 用量</text><rect x="92" y="717" width="510" height="50" rx="25" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="347" y="752" fill="#B53830" font-size="28" font-weight="650" text-anchor="middle" >结束以后追查问题</text></svg><p class="explain" data-block data-prose>运行日志不会恢复旧进程，也不会自动加入模型上下文。对话正文仍遵守上一课的快照规则。</p></div></main></body></html>
