verse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="13" width="952" height="100" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="30" y="75" fill="#202622" font-size="31" font-weight="650" text-anchor="start" >realpath(cwd) → SHA-256 → workspaceHash</text><path d="M476 127V191" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="0" y="212" width="952" height="270" rx="12" fill="#202622" stroke="#202622" stroke-width="2" /><circle cx="22" cy="234" r="4" fill="#B53830"/><circle cx="38" cy="234" r="4" fill="#896016"/><circle cx="54" cy="234" r="4" fill="#28614D"/><text x="24" y="280" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">~/.zero2agent/logs/</text><text x="24" y="327" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">  &lt;workspaceHash&gt;/</text><text x="24" y="374" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">    &lt;run-A-UUID&gt;.jsonl</text><text x="24" y="421" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">    &lt;run-B-UUID&gt;.jsonl</text><path d="M241 496V555" class="edge" stroke="#28614D" marker-end="url(#green)" /><path d="M711 496V555" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="0" y="573" width="439" height="190" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="29" y="630" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >目录 0700</text><text x="29" y="691" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >工作区隔离</text><rect x="513" y="573" width="439" height="190" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="542" y="630" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >文件 0600 · wx</text><text x="542" y="691" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >独占创建 · 不追写旧文件</text></svg><p class="explain" data-block data-prose>ZERO2AGENT_LOG_DIR 可替换根目录。run UUID 不是 session UUID；同一个会话恢复后，会在新 run 文件继续记录元信息。</p></div></main></body></html>
