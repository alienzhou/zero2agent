<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>TUI、plain、单次调用，使用同一份运行事实</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="16"><header class="page-header"><span>Zero2Agent · 所有入口保持兼容</span><span class="page-number">16</span></header><div class="heading" data-block><h1>TUI、plain、单次调用，<br>使用同一份运行事实</h1><p class="deck" data-prose>不调用模型，也能在终端追查旧记录。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="四行命令分别列表查看操作过滤和独立关闭日志与会话保存，并标明keyless只读"><title>四行命令分别列表查看操作过滤和独立关闭日志与会话保存，并标明keyless只读</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><text x="0" y="46" fill="#202622" font-size="32" font-weight="700" text-anchor="start" class="mono">--logs</text><text x="0" y="107" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >列出当前工作区的 run</text><path d="M0 159H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="215" fill="#202622" font-size="32" font-weight="700" text-anchor="start" class="mono">--log &lt;run UUID&gt;</text><text x="0" y="276" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >显示元信息与完整性警告</text><path d="M0 328H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="384" fill="#202622" font-size="32" font-weight="700" text-anchor="start" class="mono">--log-operation &lt;UUID&gt;</text><text x="0" y="445" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >与 --log 配合，只看某次操作</text><path d="M0 497H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="553" fill="#202622" font-size="32" font-weight="700" text-anchor="start" class="mono">--no-save --no-log</text><text x="0" y="614" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >分别关闭新会话保存与新日志</text><path d="M0 666H952" class="edge" stroke="#C9CDC2"  /></svg><p class="explain" data-block data-prose>列表与查看无需 API key，不创建新 run、不恢复会话、不执行工具。--plain、管道、单次调用和人工终端继续支持；默认各自写日志。</p></div></main
