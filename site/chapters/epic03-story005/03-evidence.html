<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>“没有回答”背后，可能有不同的事实</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="03"><header class="page-header"><span>Zero2Agent · 从疑问到证据</span><span class="page-number">03</span></header><div class="heading" data-block><h1>“没有回答”背后，<br>可能有不同的事实</h1><p class="deck" data-prose>先找执行边界，才能判断下一步该检查什么。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="四种故障表象各有不同证据：未发请求、HTTP失败、工具退出和断点之后未见结束"><title>四种故障表象各有不同证据：未发请求、HTTP失败、工具退出和断点之后未见结束</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><circle cx="29" cy="68" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="29" y="78" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >1</text><text x="85" y="80" fill="#202622" font-size="38" font-weight="700" text-anchor="start" >请求根本没开始</text><text x="85" y="148" fill="#28614D" font-size="29" font-weight="550" text-anchor="start" >operation start → 还没有 request</text><path d="M85 187H952" class="edge" stroke="#C9CDC2"  /><circle cx="29" cy="238" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="29" y="248" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >2</text><text x="85" y="250" fill="#202622" font-size="38" font-weight="700" text-anchor="start" >请求返回失败</text><text x="85" y="318" fill="#28614D" font-size="29" font-weight="550" text-anchor="start" >request error → auth / HTTP 401</text><path d="M85 357H952" class="edge" stroke="#C9CDC2"  /><circle cx="29" cy="408" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="29" y="418" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >3</text><text x="85" y="420" fill="#202622" font-size="38" font-weight="700" text-anchor="start" >命令执行失败</text><text x="85" y="488" fill="#28614D" font-size="29" font-weight="550" text-anchor="start" >tool completed → exitCode 7</text><path d="M85 527H952" class="edge" stroke="#C9CDC2"  /><circle cx="29" cy="578" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="29" y="588" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >4</text><text x="85" y="590" fill="#202622" font-size="38" font-weight="700" text-anchor="start" >记录在中途结束</text><text x="85" y="658" fill="#B53830" font-size="29" font-weight="550" text-anchor="start" >只有 start → 结果仍然未知</text><path d="M85 697H952" class="edge" stroke="#C9CDC2"  /></svg><p class="explain" data-block data-prose>模型说“已完成”只是回答。验收还要检查实际文件效果、工具结果和请求记录。缺少结束行不能证明工具没有执行。</p></div></main></body></html>
