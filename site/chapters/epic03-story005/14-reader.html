<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>损坏的记录，不能悄悄当作正常数据</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="14"><header class="page-header"><span>Zero2Agent · 只读验证器</span><span class="page-number">14</span></header><div class="heading" data-block><h1>损坏的记录，<br>不能悄悄当作正常数据</h1><p class="deck" data-prose>边界校验决定哪些内容可以用于追查。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="左侧完整JSONL行和残缺尾部可保留前缀，右侧中部损坏未知版本未知字段或软链接被拒绝"><title>左侧完整JSONL行和残缺尾部可保留前缀，右侧中部损坏未知版本未知字段或软链接被拒绝</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBD
