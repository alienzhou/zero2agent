<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>同一批“加载 + 写文件”，不能抢先把文件写了</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="05"><header class="page-header"><span>Zero2Agent · 04 · 先加载，再做业务</span><span class="page-number">05</span></header><div class="heading" data-block><h1>同一批“加载 + 写文件”，<br>不能抢先把文件写了</h1><p class="deck" data-prose>新步骤必须先进入模型能看到的下一次请求。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="混合批次未执行后单独加载技能再进行业务操作的时序"><title>混合批次未执行后单独加载技能再进行业务操作的时序</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M37 25V648" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><circle cx="37" cy="49" r="9" fill="#B53830"/><text x="83" y="49" fill="#B53830" font-size="32" font-weight="700" text-anchor="start" >模型提出 load_skill + write_file</text><text x="83" y="94" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >整批尚无实际效果</text><circle cx="37" cy="179" r="9" fill="#B53830"/><text x="83" y="179" fill="#B53830" font-size="32" font-weight="700" text-anchor="start" >整批返回明确的未执行结果</text><text x="83" y="224" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >每个工具调用都有配对回执</text><circle cx="37" cy="309" r="9" fill="#28614D"/><text x="83" y="309" fill="#28614D" font-size="32" font-weight="700" text-anchor="start" >模型单独调用 load_skill</text><text x="83" y="354" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >宿主读取当前正文，返回小回执</text><circle cx="37" cy="439" r="9" fill="#28614D"/><text x="83" y="439" fill="#28614D" font-size="32" font-weight="700" text-anchor="start" >下一请求带上技能正文</text><text x="83" y="484" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >模型按步骤重新提出业务调用</text><circle cx="37" cy="569" r="9" fill="#28614D"/><text x="83" y="569" fill="#28614D" font-size="32" font-weight="700" text-anchor="start" >当前权限和版本仍有效</text><text x="83" y="614" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >才允许实际修改或执行测试</text></svg><p class="explain" data-block data-prose>重规划有次数和整轮预算限制。等待审批或同批前项改变技能时，宿主再次核对版本；已经发生的真实效果保留，后续未执行调用停止，不自动重放。</p></div></main></body></html>
