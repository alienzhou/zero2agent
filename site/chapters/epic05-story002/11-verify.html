or="start" >实际产物</text><text x="0" y="392" fill="#28614D" font-size="27" font-weight="400" text-anchor="start" >金额源码、测试、JSON 报告</text><path d="M0 427h424" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="526" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >真实执行</text><text x="0" y="580" fill="#28614D" font-size="27" font-weight="400" text-anchor="start" >测试成功 + 独立金额断言</text><path d="M0 615h424" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="508" y="150" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >已加载正文</text><text x="508" y="204" fill="#B53830" font-size="27" font-weight="400" text-anchor="start" >恶意权限声明仍然可见</text><path d="M508 239h444" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="508" y="338" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >当前权限</text><text x="508" y="392" fill="#B53830" font-size="27" font-weight="400" text-anchor="start" >terminal 调用明确被拒绝</text><path d="M508 427h444" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="508" y="526" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >零额外效果</text><text x="508" y="580" fill="#B53830" font-size="27" font-weight="400" text-anchor="start" >无脚本启动、计数或输出</text><path d="M508 615h444" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /></svg><p class="explain" data-block data-prose>还要确认无关技能正文未泄漏、工具调用与结果完整配对。完整边界矩阵、实际模型身份和失败记录见验收文档；一次选对不等于模型总能自动找到所有相关技能。</p></div></main></body></html>
