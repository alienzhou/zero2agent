<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>恢复时重新读取，停用后只保留历史事实</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="08"><header class="page-header"><span>Zero2Agent · 07 · 当前版本与历史</span><span class="page-number">08</span></header><div class="heading" data-block><h1>恢复时重新读取，<br>停用后只保留历史事实</h1><p class="deck" data-prose>保存的是来源与选择元信息，不是旧授权或进程。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="恢复使用当前版本与停用后历史正文不再激活的两条时间线"><title>恢复使用当前版本与停用后历史正文不再激活的两条时间线</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="44" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >恢复会话</text><text x="0" y="132" fill="#202622" font-size="32" font-weight="700" text-anchor="start" >保存选择</text><text x="0" y="183" fill="#596057" font-size="26" font-weight="400" text-anchor="start" >来源 + 版本 A</text><path d="M253 148h57" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="334" y="132" fill="#202622" font-size="32" font-weight="700" text-anchor="start" >当前磁盘</text><text x="334" y="183" fill="#596057" font-size="26" font-weight="400" text-anchor="start" >正文已变成 B</text><path d="M587 148h57" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="668" y="132" fill="#28614D" font-size="32" font-weight="700" text-anchor="start" >重新核对</text><text x="668" y="183" fill="#596057" font-size="26" font-weight="400" text-anchor="start" >读许可 + 加载 B</text><rect x="0" y="225" width="952" height="48" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="15" y="258" fill="#28614D" font-size="26" font-weight="650" text-anchor="start" >旧版本可追查，当前身份与内容哈希重新建立</text><path d="M0 332h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="399" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >用户停用技能</text><rect x="0" y="439" width="410" height="135" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="24" y="491" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >历史：曾经加载过 A / B</text><text x="24" y="540" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >对话与真实回执保留</text><path d="M440 502H557" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" stroke-dasharray="9 8"/><rect x="608" y="439" width="344" height="135" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="780" y="491" fill="#B53830" font-size="29" font-weight="700" text-anchor="middle" >当前 loaded 列表</text><text x="780" y="546" fill="#B53830" font-size="32" font-weight="700" text-anchor="middle" >不含该技能</text><text x="0" y="650" fill="#202622" font-size="31" font-weight="650" text-anchor="start" >历史正文、摘要或旧回执，都不能重新激活技能。</text></svg><p class="explain" data-block data-prose>恢复与下一请求按当前配置、读取权限和版本重建。失踪或无法读取的已选技能保持可见失败；停用不会改写历史，也不继承脚本进程或曾经批准的操作。</p></div></main></body></html>
