<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>用户明确选，模型也能从目录里选</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="04"><header class="page-header"><span>Zero2Agent · 03 · 谁来选择技能</span><span class="page-number">04</span></header><div class="heading" data-block><h1>用户明确选，<br>模型也能从目录里选</h1><p class="deck" data-prose>两条入口都交给宿主加载当前来源。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="用户选择和模型选择汇合为同一受控激活过程"><title>用户选择和模型选择汇合为同一受控激活过程</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="48" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >用户明确选择</text><text x="510" y="48" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >模型读取目录后选择</text><rect x="0" y="83" width="442" height="142" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="26" y="137" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >CLI 启动参数</text><text x="26" y="185" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >或 /skills load</text><rect x="510" y="83" width="442" height="142" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="536" y="137" fill="#28614D" font-size="30" font-weight="400" text-anchor="start" >读取名称与描述</text><text x="536" y="185" fill="#28614D" font-size="30" font-weight="400" text-anchor="start" >调用 load_skill</text><path d="M221 246V302H476" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><path d="M731 246V302H476" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="190" y="351" width="572" height="126" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="476" y="401" fill="#202622" font-size="33" font-weight="700" text-anchor="middle" >宿主核对来源与读取权限</text><text x="476" y="448" fill="#596057" font-size="29" font-weight="400" text-anchor="middle" >正文读成功，才标记 loaded</text><path d="M476 498V552" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="476" y="610" fill="#28614D" font-size="35" font-weight="700" text-anchor="middle" >下一请求：当前正文 + 原任务</text><text x="476" y="663" fill="#596057" font-size="28" font-weight="400" text-anchor="middle" >工具回执只记录加载事实，不复制正文</text></svg><p class="explain" data-block data-prose>名称重名时必须按来源 ID 选择，不能静默覆盖。加载失败有可见状态；正文作为独立用户级上下文计入预算，固定系统说明强调它不能授予权限。</p></div></main></body></html>
