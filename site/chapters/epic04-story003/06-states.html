<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>计划、观察、未知，不要在摘要里混成一种状态</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="06"><header class="page-header"><span>Zero2Agent · 05 · 描述已发生的事</span><span class="page-number">06</span></header><div class="heading" data-block><h1>计划、观察、未知，<br>不要在摘要里混成一种状态</h1><p class="deck" data-prose>“补丁文件存在”离“修复已验证”还差一次实际检查。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="五行证据状态表，从计划到未知，标注能说和不能推断的内容"><title>五行证据状态表，从计划到未知，标注能说和不能推断的内容</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="66" rx="0" fill="#202622" stroke="none" stroke-width="2"/><text x="20" y="43" fill="#F4F1EA" font-size="30" font-weight="700" text-anchor="start" >来源内容</text><text x="485" y="43" fill="#F4F1EA" font-size="30" font-weight="700" text-anchor="start" >允许的结论</text><text x="20" y="146" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >计划部署</text><text x="485" y="146" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >存在计划；许可仍需另查</text><path d="M0 181h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="20" y="249" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >工具返回测试失败</text><text x="485" y="249" fill="#B53830" font-size="30" font-weight="400" text-anchor="start" >这次测试失败</text><path d="M0 284h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="20" y="352" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >补丁文件已写出</text><text x="485" y="352" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >文件存在；效果待验证</text><path d="M0 387h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="20" y="455" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >assistant 猜测通过</text><text x="485" y="455" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >仅有推断</text><path d="M0 490h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="20" y="558" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >未看到迁移结束</text><text x="485" y="558" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >迁移完成状态未知</text><path d="M0 593h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /></svg><p class="explain" data-block data-prose>is_error 和退出码描述工具状态，checksum-317 是诊断标识，两者应分开。禁止修改来自用户约束；未观察到执行，不会让已知禁令变成未知。</p></div></main></body></html>
