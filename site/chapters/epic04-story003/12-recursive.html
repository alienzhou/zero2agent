<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>让原始纠正，再次进入下一轮交接</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="11"><header class="page-header"><span>Zero2Agent · 10 · 多次摘要的传播风险</span><span class="page-number">11</span></header><div class="heading" data-block><h1>让原始纠正，<br>再次进入下一轮交接</h1><p class="deck" data-prose>只传上一份摘要，会把同一个错误反复传下去。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="错误摘要传递链与原史来源重新注入的对照流程"><title>错误摘要传递链与原史来源重新注入的对照流程</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="42" fill="#B53830" font-size="33" font-weight="700" text-anchor="start" >只有摘要继续传递</text><rect x="0" y="88" width="260" height="117" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="130" y="140" fill="#B53830" font-size="31" font-weight="700" text-anchor="middle" >摘要 1</text><text x="130" y="181" fill="#B53830" font-size="30" font-weight="400" text-anchor="middle" class="mono">8123</text><rect x="346" y="88" width="260" height="117" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="476" y="140" fill="#B53830" font-size="31" font-weight="700" text-anchor="middle" >摘要 2</text><text x="476" y="181" fill="#B53830" font-size="30" font-weight="400" text-anchor="middle" class="mono">8123</text><rect x="692" y="88" width="260" height="117" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="822" y="140" fill="#B53830" font-size="31" font-weight="700" text-anchor="middle" >摘要 3</text><text x="822" y="181" fill="#B53830" font-size="30" font-weight="400" text-anchor="middle" class="mono">8123</text><path d="M282 146H324" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><path d="M628 146H670" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><path d="M0 269h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="335" fill="#28614D" font-size="33" font-weight="700" text-anchor="start" >重建原史索引后</text><rect x="0" y="379" width="320" height="165" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="24" y="440" fill="#28614D" font-size="31" font-weight="700" text-anchor="start" >原话 D2：9237</text><text x="24" y="497" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >每轮从原史重建</text><path d="M348 463H505" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="540" y="379" width="412" height="165" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="563" y="440" fill="#28614D" font-size="29" font-weight="700" text-anchor="start" >旧交接 + 原文 + 新历史</text><text x="563" y="497" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >生成下一份待核对交接</text><text x="0" y="631" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >重新看到来源，提升纠错机会；效果仍要实测。</text></svg><p class="explain" data-block data-prose>每轮带回原始纠正。v3 中，已完成分块若组合后满足字节与输入预算，就按原顺序保留，避免再生成一次；仍不保证模型后续一定做对。</p></div></main></body></html>
