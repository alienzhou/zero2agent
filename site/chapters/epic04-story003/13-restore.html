<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>恢复的是事实和来源，不是过去的审批</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="13"><header class="page-header"><span>Zero2Agent · 12 · 失败与恢复</span><span class="page-number">13</span></header><div class="heading" data-block><h1>恢复的是事实和来源，<br>不是过去的审批</h1><p class="deck" data-prose>校验完整快照之后才替换当前状态。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="恢复前校验四项与失败分支，原史、绑定、配对和版本"><title>恢复前校验四项与失败分支，原史、绑定、配对和版本</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="60" fill="#B53830" font-size="46" font-weight="700" text-anchor="start" >01</text><text x="93" y="56" fill="#202622" font-size="34" font-weight="650" text-anchor="start" >版本与格式</text><text x="93" y="106" fill="#596057" font-size="27" font-weight="400" text-anchor="start" >context.format / history.version</text><path d="M0 133h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="185" fill="#B53830" font-size="46" font-weight="700" text-anchor="start" >02</text><text x="93" y="181" fill="#202622" font-size="34" font-weight="650" text-anchor="start" >原史与边界</text><text x="93" y="231" fill="#596057" font-size="27" font-weight="400" text-anchor="start" >through 合法，工具调用与结果配对</text><path d="M0 258h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="310" fill="#B53830" font-size="46" font-weight="700" text-anchor="start" >03</text><text x="93" y="306" fill="#202622" font-size="34" font-weight="650" text-anchor="start" >来源绑定</text><text x="93" y="356" fill="#596057" font-size="27" font-weight="400" text-anchor="start" >消息位置、内容哈希、原来源路径</text><path d="M0 383h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="435" fill="#B53830" font-size="46" font-weight="700" text-anchor="start" >04</text><text x="93" y="431" fill="#202622" font-size="34" font-weight="650" text-anchor="start" >当前策略</text><text x="93" y="481" fill="#596057" font-size="27" font-weight="400" text-anchor="start" >新读取重新授权，计入本轮预算</text><path d="M0 508h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="624" fill="#B53830" font-size="28" font-weight="650" text-anchor="start" >校验失败保留当前状态；旧工具记录无来源则拒绝回查。</text></svg><p class="explain" data-block data-prose>S002 正文仍有独立 TTL。v5 丢弃截断摘要，最多从原始片段发起一次更短交接请求；仍计入原预算，再失败就停止。取消不采用迟到结果，恢复不重放工具。</p></div></main></body></html>
