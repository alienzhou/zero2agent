<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>原史、交接、工作上下文如何连接</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="03"><header class="page-header"><span>Zero2Agent · 02 · 三份信息，各有用途</span><span class="page-number">03</span></header><div class="heading" data-block><h1>原史、交接、<br>工作上下文如何连接</h1><p class="deck" data-prose>只有发送视图被替换，原始事实仍在当前会话里。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="原史到模型交接和宿主索引的双分支，再合并新消息为工作上下文"><title>原史到模型交接和宿主索引的双分支，再合并新消息为工作上下文</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M0 0h276l44 44v213h-320Z" fill="#FFFEF9" stroke="#28614D" stroke-width="3"/><path d="M276 0v44h44" fill="none" stroke="#28614D" stroke-width="2"/><text x="22" y="87" fill="#28614D" font-size="30" font-weight="700" text-anchor="start" >原始对话</text><text x="22" y="149" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >用户纠正</text><text x="22" y="194" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >工具调用与结果</text><text x="22" y="239" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >assistant 的说法</text><path d="M348 100H461" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><path d="M409 100V338H464" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="492" y="0" width="460" height="190" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="517" y="63" fill="#202622" font-size="37" font-weight="700" text-anchor="start" >模型交接</text><text x="517" y="124" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >简短综合，仍需核对</text><rect x="492" y="266" width="460" height="190" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="517" y="329" fill="#28614D" font-size="37" font-weight="700" text-anchor="start" >宿主来源索引</text><text x="517" y="390" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >原文节选 + 准确引用</text><path d="M722 482V541" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="0" y="603" fill="#202622" font-size="32" font-weight="650" text-anchor="start" >交接 + 索引 + 未压缩尾部 → 本轮工作上下文</text></svg><p class="explain" data-block data-prose>复用已有压缩调度、权限、预算和结果存储。索引绑定原史位置与哈希，额外输入也计入预算；原始用户要求和工具事实保留，不修改授权。</p></div></main></body></html>
