<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>读取出错后，任务还没有完成</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="18"><header class="page-header"><span>Zero2Agent · 17 · 读取纠错与完成判断</span><span class="page-number">18</span></header><div class="heading" data-block><h1>读取出错后，<br>任务还没有完成</h1><p class="deck" data-prose>宿主记住未解决的读取，给一次有界纠错机会。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="错误参数进入pending，纠正读取成功才能结束，失败则未完成；不重放源工具"><title>错误参数进入pending，纠正读取成功才能结束，失败则未完成；不重放源工具</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="150" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="43" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >实测错误 · 两个读取模式混在一起</text><path d="M24 62h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="108" fill="#F4F1EA" font-size="25" font-weight="400" text-anchor="start" class="mono">read_tool_result({ reference, tail:true, offset:31573 })</text><path d="M0 216h366l44 44v170h-410Z" fill="#FFFEF9" stroke="#B53830" stroke-width="3"/><path d="M366 216v44h44" fill="none" stroke="#B53830" stroke-width="2"/><text x="22" y="303" fill="#B53830" font-size="30" font-weight="700" text-anchor="start" >工具拒绝参数</text><text x="22" y="365" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >没有取得证据</text><text x="22" y="410" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >保留未解决状态</text><path d="M439 322H510" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><path d="M540 216h368l44 44v170h-412Z" fill="#FFFEF9" stroke="#28614D" stroke-width="3"/><path d="M908 216v44h44" fill="none" stroke="#28614D" stroke-width="2"/><text x="562" y="303" fill="#28614D" font-size="30" font-weight="700" text-anchor="start" >原预算内纠错一次</text><text x="562" y="365" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >tail:true，省略 offset</text><text x="562" y="410" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >新调用重新授权</text><path d="M747 451V508" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="0" y="541" width="952" height="110" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="24" y="586" fill="#28614D" font-size="31" font-weight="700" text-anchor="start" >同一引用读取成功 → 才能继续完成检查</text><text x="24" y="630" fill="#B53830" font-size="28" font-weight="650" text-anchor="start" >仍未解决 → 返回未完成，不自动重跑原命令</text></svg><p class="explain" data-block data-prose>结构合法不等于证据已经读到。模型说成功、读了其他引用或读到 EOF 空页，都不能清除失败状态。控制状态只属于当前回合，反馈不写成用户指令；严格固定集验收已通过；机制回归与真实评分分别留证。</p></div></main></body></html>
