<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>索引有上限，遗漏必须可见</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="09"><header class="page-header"><span>Zero2Agent · 08 · 有限窗口如何保留证据</span><span class="page-number">09</span></header><div class="heading" data-block><h1>索引有上限，<br>遗漏必须可见</h1><p class="deck" data-prose>最近记录优先入选，早期有效约束需要继续查找。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="4096字节索引容量表和遗漏入口，容量满时显式omitted而非伪称全量"><title>4096字节索引容量表和遗漏入口，容量满时显式omitted而非伪称全量</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="120" fill="#B53830" font-size="106" font-weight="700" text-anchor="start" >4096</text><text x="336" y="80" fill="#B53830" font-size="34" font-weight="400" text-anchor="start" >字节</text><text x="337" y="139" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >整个宿主索引的上限</text><rect x="0" y="226" width="170" height="95" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="85" y="286" fill="#202622" font-size="29" font-weight="650" text-anchor="middle" >来源 1</text><rect x="183" y="226" width="170" height="95" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="268" y="286" fill="#202622" font-size="29" font-weight="650" text-anchor="middle" >来源 2</text><rect x="366" y="226" width="170" height="95" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="451" y="286" fill="#202622" font-size="29" font-weight="650" text-anchor="middle" >来源 3</text><rect x="549" y="226" width="170" height="95" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="634" y="286" fill="#202622" font-size="29" font-weight="650" text-anchor="middle" >来源 4</text><rect x="732" y="226" width="170" height="95" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="817" y="286" fill="#202622" font-size="29" font-weight="650" text-anchor="middle" >来源 5</text><text x="0" y="385" fill="#202622" font-size="32" font-weight="400" text-anchor="start" >每条节选 ≤ 480 字节，partial 标记缺口。</text><text x="0" y="447" fill="#202622" font-size="32" font-weight="400" text-anchor="start" >放不下的条目计入 omitted，原史仍保留。</text><path d="M435 488V552" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="0" y="623" fill="#28614D" font-size="29" font-weight="650" text-anchor="start" >read_history：沿 cursor 查目录，按 query 找原话。</text></svg><p class="explain" data-block data-prose>索引占用真实预算。目录 EOF 后 next_cursor 为 null，应停止翻页；读者自己的回查不会产生新原始证据。有限索引与字面搜索仍可能找不到答案。</p></div></main></body></html>
