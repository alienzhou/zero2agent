xt x="0" y="308" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >消息位置</text><text x="291" y="308" fill="#28614D" font-size="32" font-weight="700" text-anchor="start" >内容 SHA-256 前 16 位</text><path d="M0 372h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><rect x="0" y="414" width="253" height="48" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="15" y="447" fill="#28614D" font-size="26" font-weight="650" text-anchor="start" >身份校验通过</text><text x="290" y="447" fill="#202622" font-size="32" font-weight="400" text-anchor="start" >找到原来那条记录</text><rect x="0" y="513" width="253" height="48" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="15" y="546" fill="#896016" font-size="26" font-weight="650" text-anchor="start" >语义仍需核对</text><text x="290" y="546" fill="#202622" font-size="32" font-weight="400" text-anchor="start" >这条原话支持这个结论吗？</text><text x="0" y="642" fill="#B53830" font-size="29" font-weight="650" text-anchor="start" >模型伪造或引用别处的 hN:hash → 拒绝采用。</text></svg><p class="explain" data-block data-prose>索引引用由宿主附带，v4 不再要求摘要复制哈希；生成了伪引用仍拒绝采用。身份检查不是语义证明或数字签名，合法来源也可能被误读。</p></div></main></body></html>
