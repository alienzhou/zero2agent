<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>检查真实请求和文件，确认规则先于修改</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="10"><header class="page-header"><span>Zero2Agent · 09 · 分层证明行为</span><span class="page-number">10</span></header><div class="heading" data-block><h1>检查真实请求和文件，<br>确认规则先于修改</h1><p class="deck" data-prose>跟练的完成标准：范围正确，时机正确，拒绝有效。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="跟练后核对范围、执行顺序、修复效果和拒绝结果"><title>跟练后核对范围、执行顺序、修复效果和拒绝结果</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="54" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >规则范围</text><text x="0" y="111" fill="#28614D" font-size="30" font-weight="400" text-anchor="start" >重规划后有 root + api，始终无 web 规则</text><path d="M0 145h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="211" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >执行顺序</text><text x="0" y="268" fill="#28614D" font-size="30" font-weight="400" text-anchor="start" >新规则先进入请求，原批次明确未执行</text><path d="M0 302h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="368" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >修复结果</text><text x="0" y="425" fill="#28614D" font-size="30" font-weight="400" text-anchor="start" >检查文件与真实测试，不只相信 JSON 报告</text><path d="M0 459h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="525" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >拒绝结果</text><text x="0" y="582" fill="#B53830" font-size="30" font-weight="400" text-anchor="start" >越界写入被拒绝，目标文件确实不存在</text><path d="M0 616h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /></svg><p class="explain" data-block data-prose>容量边界、完整故障矩阵与证据下载见验收清单。完成跟练后再学 S002 的 Skills 按需加载；小样本通过不代表模型能遵守任意自然语言约定。</p></div></main></body></html>
