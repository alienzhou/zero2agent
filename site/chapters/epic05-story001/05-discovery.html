<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>先确定发现根，再沿目标路径逐层查找</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="05"><header class="page-header"><span>Zero2Agent · 04 · 只沿祖先链查找</span><span class="page-number">05</span></header><div class="heading" data-block><h1>先确定发现根，<br>再沿目标路径逐层查找</h1><p class="deck" data-prose>默认根是启动 cwd；跨出它不会自动向上寻找。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="从项目根到启动目录、目标目录的两条祖先链"><title>从项目根到启动目录、目标目录的两条祖先链</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="106" rx="0" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="65" fill="#F4F1EA" font-size="35" font-weight="700" text-anchor="start" >显式发现根 project/</text><path d="M476 135V211H228V276" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><path d="M476 211H724V276" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><path d="M0 310h408l44 44v201h-452Z" fill="#FFFEF9" stroke="#28614D" stroke-width="3"/><path d="M408 310v44h44" fill="none" stroke="#28614D" stroke-width="2"/><text x="22" y="397" fill="#28614D" font-size="30" font-weight="700" text-anchor="start" >启动 cwd</text><text x="22" y="459" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >root → packages → api</text><text x="22" y="504" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >启动时读取这条链</text><path d="M500 310h408l44 44v201h-452Z" fill="#FFFEF9" stroke="#896016" stroke-width="3"/><path d="M908 310v44h44" fill="none" stroke="#896016" stroke-width="2"/><text x="522" y="397" fill="#896016" font-size="30" font-weight="700" text-anchor="start" >目标路径</text><text x="522" y="459" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >root → packages → web</text><text x="522" y="504" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >调用前补读这条链</text><text x="0" y="648" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >不会递归扫描整个仓库，也不自动读用户目录。</text></svg><p class="explain" data-block data-prose>从子目录启动，可用 --instructions-root 指定包含 cwd 的根。它改变规则搜索范围，不扩大文件工具原有的写入边界。</p></div></main></body></html>
