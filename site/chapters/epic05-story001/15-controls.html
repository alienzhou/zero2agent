<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>看规则、刷新、关闭，都不需要问模型</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="15"><header class="page-header"><span>Zero2Agent · 14 · 在终端里核对来源</span><span class="page-number">15</span></header><div class="heading" data-block><h1>看规则、刷新、关闭，<br>都不需要问模型</h1><p class="deck" data-prose>复用 CLI、plain 和 TUI 的输入所有权。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="指令查看与刷新控制入口"><title>指令查看与刷新控制入口</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="245" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="43" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >无需 API key 的单次查看</text><path d="M24 62h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="108" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">node &lt;cli-entry&gt; --instructions</text><text x="24" y="157" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">--instructions-root &lt;project-dir&gt;</text><text x="24" y="206" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">--no-instructions</text><rect x="0" y="293" width="952" height="281" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="336" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >plain / TUI</text><path d="M24 355h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="401" fill="#F4F1EA" font-size="31" font-weight="400" text-anchor="start" class="mono">/instructions</text><text x="24" y="450" fill="#F4F1EA" font-size="31" font-weight="400" text-anchor="start" class="mono">/instructions refresh</text><text x="24" y="499" fill="#F4F1EA" font-size="31" font-weight="400" text-anchor="start" class="mono">/instructions off   /instructions on</text><text x="0" y="651" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >展示来源、scope、完整 SHA-256 和加载错误。</text></svg><p class="explain" data-block data-prose>查看不发模型请求。真实 PTY 测试验证取消读取审批后，下一条命令仍可输入，退出时终端模式恢复。</p></div></main></body></html>
