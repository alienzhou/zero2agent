<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>模型第一次写 api，可能还没见过 api 的约定</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="08"><header class="page-header"><span>Zero2Agent · 07 · 先补规则，再执行</span><span class="page-number">08</span></header><div class="heading" data-block><h1>模型第一次写 api，<br>可能还没见过 api 的约定</h1><p class="deck" data-prose>整批先停下，配齐未执行结果，再重新规划。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="初次调用、规则发现、未执行回执、重规划、写入的纵向流程"><title>初次调用、规则发现、未执行回执、重规划、写入的纵向流程</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M40 38V622" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><circle cx="40" cy="65" r="9" fill="#28614D"/><text x="89" y="65" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >模型提出一批工具</text><text x="89" y="109" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >根目录上下文里还没有 api 规则</text><circle cx="40" cy="186" r="9" fill="#28614D"/><text x="89" y="186" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >批次预检发现新规则</text><text x="89" y="230" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >全部目标一起检查，尚无文件效果</text><circle cx="40" cy="307" r="9" fill="#B53830"/><text x="89" y="307" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >整批返回“未执行”</text><text x="89" y="351" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >每个调用都有匹配结果</text><circle cx="40" cy="428" r="9" fill="#28614D"/><text x="89" y="428" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >下一请求带上 api 规则</text><text x="89" y="472" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >模型重新提出适合当前规则的调用</text><circle cx="40" cy="549" r="9" fill="#28614D"/><text x="89" y="549" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >当前权限与版本仍有效</text><text x="89" y="593" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >此时才进入实际工具执行</text></svg><p class="explain" data-block data-prose>runTurnLoop 先调用 prepareBatch() 和 requiresReplan()。规则重规划每轮最多 3 次，消耗原预算；卸载无关目录不计入变化。</p></div></main></body></html>
