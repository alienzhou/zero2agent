" font-weight="700" text-anchor="start" >目标目录的 AGENTS.md</text><text x="131" y="411" fill="#596057" font-size="27" font-weight="400" text-anchor="start" >仅覆盖本目录的冲突约定</text><rect x="142" y="476" width="668" height="125" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="167" y="525" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >祖先目录的 AGENTS.md</text><text x="167" y="570" fill="#596057" font-size="27" font-weight="400" text-anchor="start" >其余约定继续适用</text></svg><p class="explain" data-block data-prose>自动读取 AGENTS.md 也要经过当前 read_file 权限。文件要求“忽略审批”不构成授权；必要规则被拒绝或读不到时，受影响批次停止。</p></div></main></body></html>
