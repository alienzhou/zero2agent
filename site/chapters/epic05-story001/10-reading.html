<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>发现了文件，不代表可以读取正文</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="10"><header class="page-header"><span>Zero2Agent · 09 · 读规则也要授权</span><span class="page-number">10</span></header><div class="heading" data-block><h1>发现了文件，<br>不代表可以读取正文</h1><p class="deck" data-prose>复用 read_file 的当前权限，不另开读取后门。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="文件缺失、授权、读取失败的分支流程"><title>文件缺失、授权、读取失败的分支流程</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="262" y="0" width="428" height="92" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="476" y="59" fill="#202622" font-size="33" font-weight="700" text-anchor="middle" >AGENTS.md 存在吗？</text><path d="M262 46H111V202" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><text x="10" y="261" fill="#896016" font-size="31" font-weight="700" text-anchor="start" >缺失：无规则</text><path d="M476 121V202" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="340" y="230" width="612" height="100" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="365" y="292" fill="#28614D" font-size="30" font-weight="700" text-anchor="start" >当前读取权限 + 物理路径边界</text><path d="M646 358V425" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="340" y="455" width="612" height="100" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="365" y="518" fill="#202622" font-size="30" font-weight="700" text-anchor="start" >读取完整正文，计算内容哈希</text><text x="0" y="630" fill="#B53830" font-size="29" font-weight="700" text-anchor="start" >拒绝、不可读、超限 → 明确失败，阻止受影响批次</text></svg><p class="explain" data-block data-prose>refresh() 先区分缺失，再由 PermissionController 授权。外部符号链接、非普通文件和非法 UTF-8 都报错，不截断正文继续。</p></div></main></body></html>
