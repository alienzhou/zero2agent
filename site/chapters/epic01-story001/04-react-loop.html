<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=1080">
  <meta charset="UTF-8">
  <style>
    body { background: #F4F1EA; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .serif { font-family: 'Georgia', 'Songti SC', 'Noto Serif CJK SC', serif; }
    .page { width: 1080px; height: 1440px; background: #F4F1EA; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    
    .doc { 
      width: 960px; height: 1300px; padding: 60px 80px; display: flex; flex-direction: column; 
      box-sizing: border-box;
    }

    .header {
      display: flex; justify-content: space-between; font-size: 20px; font-weight: bold;
      letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #1A1A1A;
      padding-bottom: 20px; margin-bottom: 60px; color: #666666;
    }
    .page-num { color: #D32F2F; font-size: 24px; }
    
    .title { font-size: 64px; font-weight: 900; line-height: 1.3; color: #1A1A1A; margin-bottom: 60px; }

    /* 图片与文字分版布局 */
    .content-split {
      display: flex;
      flex-direction: column;
      gap: 40px;
      flex: 1;
    }

    .image-container {
      width: 100%;
      height: 380px;
      background: #FFFFFF;
      border: 1px solid #1A1A1A;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    
    /* 图片占位符/边框装饰 */
    .image-container::after {
      content: '';
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 1px dashed #CCCCCC;
      pointer-events: none;
    }
    
    .image-container img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .text-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .subtitle {
      font-size: 38px;
      font-weight: 800;
      color: #1A1A1A;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .subtitle::before {
      content: '';
      display: block;
      width: 16px;
      height: 16px;
      background: #1A1A1A;
      border-radius: 2px;
    }

    .desc-box {
      font-size: 28px;
      color: #4A4A4A;
      line-height: 1.7;
      padding-left: 32px;
      border-left: 2px solid #CCCCCC;
    }
    
    .highlight-word {
      font-weight: bold;
      color: #1A1A1A;
      border-bottom: 2px solid #D32F2F;
    }

    .summary {
      margin-top: auto; border-top: 4px solid #1A1A1A; padding-top: 40px;
      display: flex; gap: 24px; align-items: center;
    }
    .summary-mark { font-size: 48px; color: #D32F2F; line-height: 1; }
    .summary-text { font-size: 32px; font-weight: bold; color: #1A1A1A; letter-spacing: 1px; }
  </style>
</head>
<body>
<div class="page">
  <div class="doc">
    <div class="header">
      <span class="serif">Zero2Agent • 核心机制</span>
      <span class="page-num serif">04</span>
    </div>
    
    <div class="title">Story 1: 让 Agent<br>跑起核心循环</div>
    
    <div class="content-split">
      <div class="image-container">
        <!-- 待替换为 s001-qa-vs-agent.jpg 或 s001-react-loop.png -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="720" height="252" role="img" aria-label="ReAct 闭环：模型思考，调用工具，观察结果，再次思考"><defs><marker id="react-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A1A"/></marker></defs><g fill="#F4F1EA" stroke="#1A1A1A" stroke-width="2"><rect x="30" y="70" width="190" height="96" rx="10"/><rect x="300" y="70" width="190" height="96" rx="10" fill="#F4E7E1" stroke="#AC3D30"/><rect x="570" y="70" width="190" height="96" rx="10"/></g><g fill="#1A1A1A" text-anchor="middle" font-family="sans-serif" font-size="29"><text x="125" y="110">思考决策</text><text x="395" y="110">调用工具</text><text x="665" y="110">观察结果</text></g><g fill="#666666" text-anchor="middle" font-family="monospace" font-size="19"><text x="125" y="143">REASON</text><text x="395" y="143">ACT</text><text x="665" y="143">OBSERVE</text></g><g stroke="#1A1A1A" stroke-width="2.5" fill="none" marker-end="url(#react-arrow)"><path d="M220 118H285"/><path d="M490 118H555"/><path d="M665 166V222H125V181"/></g><rect x="258" y="199" width="275" height="42" fill="#FFFFFF"/><text x="395" y="227" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#AC3D30">带回结果，直到任务完成</text></svg>
      </div>
      
      <div class="text-container">
        <div class="subtitle">聊天 vs Agent：本质差异在哪？</div>
        <div class="desc-box">
          传统的 AI 对话是<span class="highlight-word">一问一答的开环</span>；<br>
          而 Agent 的核心，是一个<span class="highlight-word">自主运行的闭环</span>。<br><br>
          在第一课中，我们将用最精简的代码，实现最经典的 <b>ReAct (Reasoning and Acting)</b> 模式。让 AI 学会：<br>
          观察环境 → 思考决策 → 调用工具执行。
        </div>
      </div>
    </div>
    
    <div class="summary">
      <div class="summary-mark serif">"</div>
      <div class="summary-text serif">这是 CC/Codex/Cursor 等 Agent 的基石。</div>
    </div>
  </div>
</div>
</body>
</html>
