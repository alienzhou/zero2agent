<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=1080">
  <meta charset="UTF-8">
  <style>
    /* 内容页：轻量化期刊风（去边框、大留白、重排版） */
    body { background: #F4F1EA; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .serif { font-family: 'Georgia', 'Songti SC', 'Noto Serif CJK SC', serif; }
    .page { width: 1080px; height: 1440px; background: #F4F1EA; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    
    .doc { 
      width: 960px; height: 1300px; padding: 60px 80px; display: flex; flex-direction: column; 
      box-sizing: border-box;
      /* 去掉复杂的四周边框，完全依赖留白 */
    }

    .header {
      display: flex; justify-content: space-between; font-size: 20px; font-weight: bold;
      letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #1A1A1A;
      padding-bottom: 20px; margin-bottom: 60px; color: #666666;
    }
    .page-num { color: #D32F2F; font-size: 24px; }
    
    .title { font-size: 64px; font-weight: 900; line-height: 1.3; color: #1A1A1A; margin-bottom: 80px; }

    .list { display: flex; flex-direction: column; gap: 60px; flex: 1; }
    
    .item { position: relative; padding-left: 60px; }
    /* 悬挂式红色标号 */
    .item-num {
      position: absolute; left: 0; top: 6px; font-size: 28px; font-weight: bold; 
      color: #D32F2F;
    }
    
    .item-title { font-size: 38px; font-weight: 800; color: #1A1A1A; margin-bottom: 16px; }
    .item-desc { font-size: 28px; color: #4A4A4A; line-height: 1.7; }
    
    /* 底部粗线总结 */
    .summary {
      margin-top: auto; border-top: 4px solid #1A1A1A; padding-top: 40px;
      display: flex; gap: 24px; align-items: center;
    }
    .summary-mark { font-size: 48px; color: #D32F2F; line-height: 1; }
    .summary-text { font-size: 34px; font-weight: bold; color: #1A1A1A; letter-spacing: 1px; }

  </style>
</head>
<body>
<div class="page">
  <div class="doc">
    <div class="header">
      <span class="serif">Zero2Agent • 核心特色</span>
      <span class="page-num serif">02</span>
    </div>
    
    <div class="title">这门课，<br>有什么不一样？</div>
    
    <div class="list">
      <div class="item">
        <div class="item-num serif">1.</div>
        <div class="item-title">实际项目经验</div>
        <div class="item-desc">学了很多 AI 应用开发，面试被问到还是答不上来？<br>这门课不只 demo，还教你工程细节，分享实际项目经验。</div>
      </div>
      <div class="item">
        <div class="item-num serif">2.</div>
        <div class="item-title">低投入门槛</div>
        <div class="item-desc">每节只做一件小事，快速学概念和上手搞实操都可以。</div>
      </div>
      <div class="item">
        <div class="item-num serif">3.</div>
        <div class="item-title">像追剧一样</div>
        <div class="item-desc">每周持续更新，从「能看能查」到「能动能改」到「产品化」，循序渐进。</div>
      </div>
    </div>
    
    <div class="summary">
      <div class="summary-mark serif">"</div>
      <div class="summary-text serif">一门可以跟练的<span style="background: #D32F2F; color: #FFFFFF; padding: 4px 12px; border-radius: 4px; margin: 0 8px; transform: rotate(-2deg); display: inline-block;">开源免费的实战</span>课程。</div>
    </div>
  </div>
</div>
</body>
</html>
