<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>没有收到结果，不能推断操作没发生</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="08"><header class="page-header"><span>Zero2Agent · 07 · 断线后的关键判断</span><span class="page-number">08</span></header><div class="heading" data-block><h1>没有收到结果，<br>不能推断操作没发生</h1><p class="deck" data-prose>调用发出后断线、取消或超时，都可能已有外部效果。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="先产生一次效果再断线后停止未知调用且不重放的时序"><title>先产生一次效果再断线后停止未知调用且不重放的时序</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M35 30V645" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><circle cx="35" cy="40" r="8" fill="#28614D"/><text x="79" y="42" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >record_action 发出</text><text x="79" y="87" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >服务把本地计数从 0 改成 1</text><circle cx="35" cy="170" r="8" fill="#B53830"/><text x="79" y="172" fill="#B53830" font-size="34" font-weight="700" text-anchor="start" >连接在回包前断开</text><text x="79" y="217" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >客户端没有完整结果</text><circle cx="35" cy="300" r="8" fill="#896016"/><text x="79" y="302" fill="#896016" font-size="34" font-weight="700" text-anchor="start" >记为 unknown，停止本轮</text><text x="79" y="347" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >后续未执行项仍配对为 not-started</text><circle cx="35" cy="430" r="8" fill="#28614D"/><text x="79" y="432" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >用户核对效果并明确继续</text><text x="79" y="477" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >保留既有效果，重建当前连接与权限</text><circle cx="35" cy="560" r="8" fill="#28614D"/><text x="79" y="562" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >不会重放原调用</text><text x="79" y="607" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >计数保持 1；不宣称已经回滚</text></svg><p class="explain" data-block data-prose>沿用 E04 的 /recovery 与显式继续入口。接收到工具业务错误与传输失败分别处理；进程清理报错也不能把未知效果降成可继续的普通失败。</p></div></main></body></html>
