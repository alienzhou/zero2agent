<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>允许启动服务，不等于批准它的工具</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="04"><header class="page-header"><span>Zero2Agent · 03 · 两次独立决定</span><span class="page-number">04</span></header><div class="heading" data-block><h1>允许启动服务，<br>不等于批准它的工具</h1><p class="deck" data-prose>配置文件与服务声明都不能自行授予权限。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="配置启用门与每次工具授权门相互独立"><title>配置启用门与每次工具授权门相互独立</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="44" fill="#202622" font-size="35" font-weight="700" text-anchor="start" >① 用户显式启用本地代码</text><path d="M0 91h355l40 40v150h-395Z" fill="#FFFEF9" stroke="#202622" stroke-width="3"/><path d="M355 91v40h40" fill="none" stroke="#202622" stroke-width="2"/><text x="22" y="166" fill="#202622" font-size="31" font-weight="700" text-anchor="start" >mcp.json</text><text x="22" y="223" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >command / args / env</text><path d="M420 182H550" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><rect x="589" y="107" width="363" height="130" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="770" y="160" fill="#28614D" font-size="27" font-weight="600" text-anchor="middle" class="mono">--mcp-enable issues</text><text x="770" y="211" fill="#28614D" font-size="32" font-weight="700" text-anchor="middle" >才启动进程</text><path d="M0 333h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="401" fill="#202622" font-size="35" font-weight="700" text-anchor="start" >② 每次工具调用重新授权</text><rect x="0" y="451" width="395" height="120" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="197" y="499" fill="#896016" font-size="29" font-weight="600" text-anchor="middle" class="mono">readOnlyHint: true</text><text x="197" y="545" fill="#596057" font-size="28" font-weight="400" text-anchor="middle" >只是服务自报</text><path d="M420 512H550" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" stroke-dasharray="9 8"/><rect x="589" y="451" width="363" height="120" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="770" y="500" fill="#B53830" font-size="32" font-weight="700" text-anchor="middle" >当前宿主权限</text><text x="770" y="545" fill="#B53830" font-size="29" font-weight="500" text-anchor="middle" >不因此放行</text><text x="0" y="649" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >本地进程有宿主权限；stdio 不提供 OS 沙箱。</text></svg><p class="explain" data-block data-prose>外部工具统一按 execute 授权，accept-edits 不自动放行，read-only 拒绝调用。没有审批处理器时明确拒绝；固定跟练只允许必要的工具。</p></div></main></body></html>
