<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>同名工具可以共存，旧调用不能换个服务执行</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="05"><header class="page-header"><span>Zero2Agent · 04 · 工具表与路由</span><span class="page-number">05</span></header><div class="heading" data-block><h1>同名工具可以共存，<br>旧调用不能换个服务执行</h1><p class="deck" data-prose>名称映射包含服务 ID，并核对原始工具名称。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="两个服务相同get_issue名称映射为不同的模型工具身份"><title>两个服务相同get_issue名称映射为不同的模型工具身份</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="452" height="155" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="26" y="55" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >issues</text><text x="26" y="116" fill="#202622" font-size="31" font-weight="500" text-anchor="start" class="mono">get_issue</text><path d="M226 179V261" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="500" y="0" width="452" height="155" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="526" y="55" fill="#896016" font-size="36" font-weight="700" text-anchor="start" >archive</text><text x="526" y="116" fill="#202622" font-size="31" font-weight="500" text-anchor="start" class="mono">get_issue</text><path d="M726 179V261" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><g data-terminal="0 292 952 190"><rect x="0" y="292" width="952" height="190" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="335" fill="#B8C8B9" font-size="25" font-weight="500" text-anchor="start" >稳定的模型工具名 · 摘要缩写示意</text><path d="M24 354h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="400" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start" class="mono">mcp_issues_&lt;原工具名哈希&gt;</text><text x="24" y="449" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start" class="mono">mcp_archive_&lt;原工具名哈希&gt;</text></g><path d="M0 552h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="610" fill="#B53830" font-size="31" font-weight="650" text-anchor="start" >本轮工具表固定；变更通知 → 停止后续调用。</text><text x="0" y="665" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >下一次用户操作才重新连接与发现。</text></svg><p class="explain" data-block data-prose>映射保持在模型名称长度限制内，冲突会报错。目录有页数和工具数上限；不会根据服务推送静默重路由已经提出的调用。</p></div></main></body></html>
