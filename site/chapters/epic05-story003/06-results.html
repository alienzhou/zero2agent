<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>参数不合法就不发送，返回内容也不能随意丢弃</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="06"><header class="page-header"><span>Zero2Agent · 05 · 先校验，再解释</span><span class="page-number">06</span></header><div class="heading" data-block><h1>参数不合法就不发送，<br>返回内容也不能随意丢弃</h1><p class="deck" data-prose>本课支持文本与 structuredContent JSON 对象。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="输入Schema校验和工具结果三种不同结算"><title>输入Schema校验和工具结果三种不同结算</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="123" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="30" y="52" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >输入 JSON Schema</text><text x="30" y="99" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >通过校验 → tools/call；失败 → 明确未发送</text><path d="M476 146V217" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="0" y="258" width="300" height="309" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="21" y="314" fill="#28614D" font-size="31" font-weight="700" text-anchor="start" >正常结果</text><text x="21" y="
