<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>先查看工具表，再带上明确授权做任务</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="10"><header class="page-header"><span>Zero2Agent · 09 · 亲手接入</span><span class="page-number">10</span></header><div class="heading" data-block><h1>先查看工具表，<br>再带上明确授权做任务</h1><p class="deck" data-prose>没有模型凭据，也可以检查本地连接与目录。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="CLI MCP配置与离线跟练的实际入口"><title>CLI MCP配置与离线跟练的实际入口</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><g data-terminal="0 0 952 250"><rect x="0" y="0" width="952" height="250" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="43" fill="#B8C8B9" font-size="25" font-weight="500" text-anchor="start" >在仓库构建后 · 配置中的 node 路径需显式填写</text><path d="M24 62h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="108" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start" class="mono">--mcp-config /path/to/mcp.json</text><text x="24" y="157" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start" class="mono">--mcp-enable issues --mcp</text><text x="24" y="206" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start" class="mono">→ 显示状态与映射后的工具名</text></g><g data-terminal="0 302 952 190"><rect x="0" y="302" width="952" height="190" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="345" fill="#B8C8B9" font-size="25" font-weight="500" text-anchor="start" >固定离线跟练</text><path d="M24 364h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="410" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">pnpm build</text><text x="24" y="459" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">node researches/mcp/demo.mjs</text></g><text x="0" y="595" fill="#202622" font-size="29" font-weight="600" text-anchor="start" class="mono">SDK：Agent({ mcp: { servers: [...] } })</text><text x="0" y="651" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >当前轮结束关闭；恢复历史不会自动启动旧进程。</text></svg><p class="explain" data-block data-prose>CLI 配置不接受 enabled 字段，启用由启动参数决定；SDK 则由调用方显式设置 enabled:true。真实任务的每次调用与保存结果回读仍需当前权限。</p></div></main></body></html>
