<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>E03-S001 · 10 · 请求预算，不能只数聊天正文</title><link rel="stylesheet" href="course.css"></head><body><article class="sheet lesson" data-page="10" data-sources="C13"><header class="page-header" data-block><span>Zero2Agent · 从多轮到长上下文</span><span class="page-number">10</span></header><div class="heading" data-block><h1>请求预算，不能只数聊天正文</h1><p class="deck">读几个大文件，可能比聊很多轮更快占满窗口</p></div><main class="content">
<div class="request" data-block><div class="request-label">完整请求预算 · 结构示意，非等比例图</div><div class="message-line"><b>输入</b><span>system + 工具定义 + 消息</span></div><div class="message-line"><b>预留</b><span>输出空间 + 安全余量</span></div><div class="message-line newest"><b>窗口</b><span>两部分合计不能超过模型窗口</span></div></div>
