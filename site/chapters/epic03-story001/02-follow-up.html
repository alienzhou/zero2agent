<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>E03-S001 · 02 · 一句「接着做」，它该知道什么？</title><link rel="stylesheet" href="course.css"></head><body><article class="sheet lesson" data-page="02" data-sources="C01 C02"><header class="page-header" data-block><span>Zero2Agent · 问题从哪里来</span><span class="page-number">02</span></header><div class="heading" data-block><h1>一句「接着做」，它该知道什么？</h1><p class="deck">先把两次输入放在同一个任务里看</p></div><main class="content"><div class="scenario" data-block><p class="mini-label">教学情景示意 · 省略具体模型回复</p><div class="dialogue-row"><span class="step-id">01</span><div><h2>先看项目</h2><p data-prose>「检查测试结构，给我一个补测建议。」</p></div></div><div class="dialogue-row"><span class="step-id">02</span><div><h2>继续动手</h2><p data-prose>「按刚才的建议，先补一个测试。」</p></div></div></div>
