<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>E03-S001 · 04 · 会话、轮次、循环，各管一层</title><link rel="stylesheet" href="course.css"></head><body><article class="sheet lesson" data-page="04" data-sources="C03"><header class="page-header" data-block><span>Zero2Agent · 分清生命周期</span><span class="page-number">04</span></header><div class="heading" data-block><h1>会话、轮次、循环，各管一层</h1><p class="deck">先分清范围，再决定消息放在哪里</p></div><main class="content"><div class="session-box" data-block><div class="box-label">Session · 一段会话</div><p class="box-intro" data-prose>持有多轮历史，直到清空或进程退出。</p><div class="turn-box"><div class="box-label">Turn 1 · 一次用户请求</div><p data-prose>「分析测试，再补一个测试。」</p><div class="loop-box"><strong>Loop · 轮内反复推进</strong><div class="loop-track"><span>调用模型</span><span class="accent">⇄</span><span>执行工具</span></div><p class="note" data-prose>需要工具时，结果再交回模型；无需工具时可直接结束。</p></div></div><div class="turn-box next-turn"><div class="box-label">Turn 2 · 下一次用户请求</div><p data-prose>「再检查一下边界情况。」</p></div></div>
<p class="note" data-block data-prose>一次 Turn 里可以有多次模型请求。结束一轮，不等于结束整段 Session。</p></main></article></body></html>
