<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>把回退拆成预览和确认两次命令</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="16"><header class="page-header"><span>Zero2Agent · 无密钥也能恢复</span><span class="page-number">16</span></header><div class="heading" data-block><h1>把回退拆成<br>预览和确认两次命令</h1><p class="deck" data-prose>同一套文件校验服务于 TUI、plain 和单次 CLI。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="CLI列表差异预览确认与统计五种调用路径不需要模型服务"><title>CLI列表差异预览确认与统计五种调用路径不需要模型服务</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><text x="0" y="58" fill="#202622" font-size="30" font-weight="700" text-anchor="start" class="mono">--checkpoints</text><text x="0" y="118" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >列出当前工作区的记录</text><path d="M0 160H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="200" fill="#202622" font-size="30" font-weight="700" text-anchor="start" class="mono">--checkpoint UUID</text><text x="0" y="260" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >查看保存的 before / after 差异</text><path d="M0 302H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="342" fill="#202622" font-size="30" font-weight="700" text-anchor="start" class="mono">--undo UUID</text><text x="0" y="402" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >打印回退计划与确认令牌</text><path d="M0 444H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="484" fill="#202622" font-size="30" font-weight="700" text-anchor="start" class="mono">--undo UUID --confirm HASH</text><text x="0" y="544" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >重新校验令牌并执行</text><path d="M0 586H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="626" fill="#202622" font-size="30" font-weight="700" text-anchor="start" class="mono">--checkpoint-stats</text><text x="0" y="686" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >逻辑量 / 存储量 / 分配占用</text><path d="M0 728H952" class="edge" stroke="#C9CDC2"  /></svg><p class="explain" data-block data-prose>--recover UUID 处理未结算记录；--checkpoint-prune 清理过期历史。命令返回前完成文件操作，不会调用模型、旧工具或恢复旧进程。</p></div></main></body></html>
