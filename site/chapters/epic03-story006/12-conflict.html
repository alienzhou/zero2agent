<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>用户后来又改了文件，回退必须先停下来</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="12"><header class="page-header"><span>Zero2Agent · 三方比较</span><span class="page-number">12</span></header><div class="heading" data-block><h1>用户后来又改了文件，<br>回退必须先停下来</h1><p class="deck" data-prose>before 是目标；after 是允许替换的预期状态。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="before旧版本after工具结果live当前文件三个版本比较，live等于after则可回退，不等则冲突"><title>before旧版本after工具结果live当前文件三个版本比较，live等于after则可回退，不等则冲突</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="30" width="292" height="167" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="25" y="85" fill="#202622" font-size="35" font-weight="700" text-anchor="start" class="mono">before</text><text x="25" y="151" fill="#202622" font-size="25" font-weight="550" text-anchor="start" class="mono">theme=light</text><rect x="330" y="30" width="292" height="167" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="355" y="85" fill="#202622" font-size="35" font-weight="700" text-anchor="start" class="mono">after</text><text x="355" y="151" fill="#202622" font-size="25" font-weight="550" text-anchor="start" class="mono">theme=dark</text><rect x="660" y="30" width="292" height="167" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="685" y="85" fill="#202622" font-size="35" font-weight="700" text-anchor="start" class="mono">live</text><text x="685" y="151" fill="#202622" font-size="25" font-weight="550" text-anchor="start" class="mono">theme=human</text><path d="M476 222V314H806V222" class="edge" stroke="#B53830"  /><text x="646" y="374" fill="#B53830" font-size="38" font-weight="700" text-anchor="middle" class="mono">after ≠ live</text><rect x="0" y="459" width="952" height="154" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="29" y="523" fill="#B53830" font-size="42" font-weight="700" text-anchor="start" >拒绝覆盖后续修改</text><text x="29" y="579" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >全部文件预检；确认时再次计算摘要。</text><text x="0" y="727" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >预览令牌绑定清单与当前文件；过期就重新预览。</text></svg><p class="explain" data-block data-prose>没有 force 覆盖入口。检查覆盖内容与 rwx 权限；相同内容但不同权限也会被判为变化。普通文件 API 不能隔离任意并发写入。</p></div></main></body></html>
