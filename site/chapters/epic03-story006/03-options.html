<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>空间小、保存快、恢复稳，往往需要取舍</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="03"><header class="page-header"><span>Zero2Agent · 比较存储方案</span><span class="page-number">03</span></header><div class="heading" data-block><h1>空间小、保存快、恢复稳，<br>往往需要取舍</h1><p class="deck" data-prose>先看工作负载，再选存储结构。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="整仓副本、隐藏Git、文本补丁和分块内容寻址四种设计对比"><title>整仓副本、隐藏Git、文本补丁和分块内容寻址四种设计对比</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><circle cx="28" cy="67" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="28" y="77" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >1</text><text x="85" y="79" fill="#202622" font-size="37" font-weight="700" text-anchor="start" >整仓副本</text><text x="85" y="142" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >无关文件也复制；空间随仓库增长。</text><path d="M85 192H952" class="edge" stroke="#C9CDC2"  /><circle cx="28" cy="236" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="28" y="246" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >2</text><text x="85" y="248" fill="#202622" font-size="37" font-weight="700" text-anchor="start" >隐藏 Git 仓库</text><text x="85" y="311" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >有成熟对象模型；仍需扫描与维护。</text><path d="M85 361H952" class="edge" stroke="#C9CDC2"  /><circle cx="28" cy="405" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="28" y="415" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >3</text><text x="85" y="417" fill="#202622" font-size="37" font-weight="700" text-anchor="start" >仅存文本补丁</text><text x="85" y="480" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >小改动紧凑；依赖基础版本与补丁链。</text><path d="M85 530H952" class="edge" stroke="#C9CDC2"  /><circle cx="28" cy="574" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="28" y="584" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >4</text><text x="85" y="586" fill="#28614D" font-size="37" font-weight="700" text-anchor="start" >按路径分块 CAS</text><text x="85" y="649" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >只读涉及文件；块可复用，校验有成本。</text><path d="M85 699H952" class="edge" stroke="#C9CDC2"  /></svg><p class="explain" data-block data-prose>CAS 是按内容哈希寻址。本课不调用 Git 保存或恢复；也不宣称总比 Git pack 更省，实测比较的是明确标注的存储基线。</p></div></main></body></html>
