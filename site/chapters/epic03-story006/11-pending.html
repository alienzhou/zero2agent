<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>少了一份 after，不能推断文件没变</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="11"><header class="page-header"><span>Zero2Agent · 写入中断</span><span class="page-number">11</span></header><div class="heading" data-block><h1>少了一份 after，<br>不能推断文件没变</h1><p class="deck" data-prose>before 发布后才执行，异常结算仍需要读磁盘。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="持久化before后工具发生副作用，再保存after；崩溃可发生在任意两者之间，pending只能说明结果未知"><title>持久化before后工具发生副作用，再保存after；崩溃可发生在任意两者之间，pending只能说明结果未知</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="28" width="952" height="149" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="29" y="90" fill="#202622" font-size="39" font-weight="700" text-anchor="start" >before 已保存</text><text x="29" y="145" fill="#28614D" font-size="30" font-weight="600" text-anchor="start" class="mono">pending</text><path d="M476 195V242" class="edge" stroke="#202622" marker-end="url(#ink)" /><rect x="0" y="265" width="952" height="149" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2" /><text x="29" y="327" fill="#202622" font-size="39" font-weight="700" text-anchor="start" >工具修改了文件</text><text x="29" y="382" fill="#896016" font-size="30" font-weight="600" text-anchor="start" class="mono">真实副作用</text><path d="M476 432V479" class="edge" stroke="#202622" marker-end="url(#ink)" /><rect x="0" y="502" width="952" height="149" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="29" y="564" fill="#202622" font-size="39" font-weight="700" text-anchor="start" >after 已保存</text><text x="29" y="619" fill="#28614D" font-size="30" font-weight="600" text-anchor="start" class="mono">ready</text><text x="0" y="751" fill="#B53830" font-size="30" font-weight="650" text-anchor="start" >/recover 预览当前文件，再明确选择恢复旧版本。</text></svg><p class="explain" data-block data-prose>未结算记录会阻止新的受保护写入。恢复不重放旧工具，且需确认原进程已退出；PID 无法确认时拒绝猜测。</p></div></main></body></html>
