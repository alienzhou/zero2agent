<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>先写恢复意图，再逐个替换文件</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="13"><header class="page-header"><span>Zero2Agent · 回退也会失败</span><span class="page-number">13</span></header><div class="heading" data-block><h1>先写恢复意图，<br>再逐个替换文件</h1><p class="deck" data-prose>多文件回退不是一次原子事务。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="恢复意图记录from/to，文件A完成文件B未完成；重启后检查live若已为目标跳过若仍为from继续否则冲突"><title>恢复意图记录from/to，文件A完成文件B未完成；重启后检查live若已为目标跳过若仍为from继续否则冲突</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="10" width="952" height="127" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="29" y="65" fill="#28614D" font-size="35" font-weight="700" text-anchor="start" >先持久化：每个文件的 from / to</text><text x="29" y="112" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >回退自身拥有新的 UUID，可再 /undo。</text><path d="M476 157V218" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="0" y="239" width="420" height="147" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="25" y="299" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >文件 A · 已替换</text><text x="25" y="353" fill="#596057" font-size="30" font-weight="500" text-anchor="start" class="mono">live = to</text><rect x="532" y="239" width="420" height="147" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2" /><text x="557" y="299" fill="#896016" font-size="36" font-weight="700" text-anchor="start" >文件 B · 中断</text><text x="557" y="353" fill="#596057" font-size="30" font-weight="500" text-anchor="start" class="mono">live = from</text><text x="0" y="495" fill="#202622" font-size="32" font-weight="650" text-anchor="start" class="mono">live = to</text><path d="M365 485H435" class="edge" stroke="#28614D" marker-end="url(#green)" /><text x="474" y="495" fill="#28614D" font-size="32" font-weight="650" text-anchor="start" >已达到目标，跳过</text><text x="0" y="600" fill="#202622" font-size="32" font-weight="650" text-anchor="start" class="mono">live = from</text><path d="M365 590H435" class="edge" stroke="#28614D" marker-end="url(#green)" /><text x="474" y="600" fill="#28614D" font-size="32" font-weight="650" text-anchor="start" >重新校验后继续</text><text x="0" y="705" fill="#202622" font-size="32" font-weight="650" text-anchor="start" class="mono">其他状态</text><path d="M365 695H435" class="edge" stroke="#B53830" marker-end="url(#red)" /><text x="474" y="705" fill="#B53830" font-size="32" font-weight="650" text-anchor="start" >冲突，停止写入</text></svg><p class="explain" data-block data-prose>普通文件使用同目录临时文件、同步与替换；新建用不覆盖的发布方式。恢复删除文件时可能留下空目录，不能承诺目录树完全回到过去。</p></div></main></body></html>
