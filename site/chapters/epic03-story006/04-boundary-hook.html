<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>通知可以丢，写入前的保护必须等待</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="04"><header class="page-header"><span>Zero2Agent · Core 与宿主的连接</span><span class="page-number">04</span></header><div class="heading" data-block><h1>通知可以丢，<br>写入前的保护必须等待</h1><p class="deck" data-prose>把 Checkpoint 接成控制接口，而不是日志回调。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="模型调用先权限审批，再等待before存储，然后执行工具，最后记录实际after；失败分支阻止写入"><title>模型调用先权限审批，再等待before存储，然后执行工具，最后记录实际after；失败分支阻止写入</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="150" y="20" width="802" height="137" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="178" y="73" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >1 权限允许</text><text x="178" y="126" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >拒绝的工具没有文件效果</text><path d="M80 85V235" class="edge" stroke="#28614D" marker-end="url(#green)" /><circle cx="80" cy="60" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="80" y="70" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >1</text><rect x="150" y="210" width="802" height="137" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="178" y="263" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >2 保存 before</text><text x="178" y="316" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >旧字节发布成功才继续</text><path d="M80 275V425" class="edge" stroke="#28614D" marker-end="url(#green)" /><circle cx="80" cy="250" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="80" y="260" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >2</text><rect x="150" y="400" width="802" height="137" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="178" y="453" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >3 执行真实工具</text><text x="178" y="506" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >执行失败也可能已有部分效果</text><path d="M80 465V615" class="edge" stroke="#28614D" marker-end="url(#green)" /><circle cx="80" cy="440" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="80" y="450" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >3</text><rect x="150" y="590" width="802" height="137" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="178" y="643" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >4 保存实际 after</text><text x="178" y="696" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >记录磁盘事实，不能相信回答文字</text><circle cx="80" cy="630" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="80" y="640" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >4</text></svg><p class="explain" data-block data-prose>FileMutationHandler 会被等待，异常会变成配对工具错误；展示 observer 继续保持不影响执行。取消在等待后再次检查。</p></div></main></body></html>
