<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>删掉记录后，才能判断哪些块不用了</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="10"><header class="page-header"><span>Zero2Agent · 回收的正确顺序</span><span class="page-number">10</span></header><div class="heading" data-block><h1>删掉记录后，<br>才能判断哪些块不用了</h1><p class="deck" data-prose>两个文件相同的内容，也能引用同一个块。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="两条记录共享块B，删除第一条后只能回收A，B仍被第二条使用，先同步引用删除再删除块"><title>两条记录共享块B，删除第一条后只能回收A，B仍被第二条使用，先同步引用删除再删除块</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="50" width="395" height="110" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="198" y="120" fill="#B53830" font-size="34" font-weight="700" text-anchor="middle" >记录 1：A · B</text><rect x="557" y="50" width="395" height="110" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="754" y="120" fill="#28614D" font-size="34" font-weight="700" text-anchor="middle" >记录 2：B · C</text><path d="M190 180V276H123V349" class="edge" stroke="#B53830" marker-end="url(#red)" /><path d="M250 180V250H476V349" class="edge" stroke="#B53830" marker-end="url(#red)" /><path d="M680 180V250H476" class="edge" stroke="#28614D"  /><path d="M780 180V280H829V349" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="0" y="371" width="246" height="175" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="123" y="438" fill="#B53830" font-size="43" font-weight="700" text-anchor="middle" >A</text><text x="123" y="502" fill="#202622" font-size="31" font-weight="550" text-anchor="middle" >可回收</text><rect x="353" y="371" width="246" height="175" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="476" y="438" fill="#28614D" font-size="43" font-weight="700" text-anchor="middle" >B</text><text x="476" y="502" fill="#202622" font-size="31" font-weight="550" text-anchor="middle" >仍共享</text><rect x="706" y="371" width="246" height="175" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="829" y="438" fill="#28614D" font-size="43" font-weight="700" text-anchor="middle" >C</text><text x="829" y="502" fill="#202622" font-size="31" font-weight="550" text-anchor="middle" >仍使用</text><text x="0" y="663" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >删除过期清单 → 同步目录 → 扫描剩余引用</text><text x="0" y="729" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >只删除没有引用的对象；损坏清单使清理失败。</text></svg><p class="explain" data-block data-prose>清理只扫描有界存储目录，不扫描工作区文件。未结算清单是保留根；它引用的 before 块不能按普通过期历史删除。</p></div></main></body></html>
