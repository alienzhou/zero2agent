<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>文件退回去了，其他状态怎样处理？</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="02"><header class="page-header"><span>Zero2Agent · 先划清恢复范围</span><span class="page-number">02</span></header><div class="heading" data-block><h1>文件退回去了，<br>其他状态怎样处理？</h1><p class="deck" data-prose>文件、会话与日志关联；进程和外部状态不随之回退。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="文件清单保存前后版本，会话保留工具调用回执并追加恢复事实，日志只记录元信息，命令进程与外部请求不被回退"><title>文件清单保存前后版本，会话保留工具调用回执并追加恢复事实，日志只记录元信息，命令进程与外部请求不被回退</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><circle cx="27" cy="66" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="27" y="76" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >1</text><text x="84" y="76" fill="#28614D" font-size="37" font-weight="700" text-anchor="start" >文件 Checkpoint</text><text x="84" y="141" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >保存 before / after，只恢复受控路径</text><path d="M84 184H952" class="edge" stroke="#C9CDC2"  /><circle cx="27" cy="230" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="27" y="240" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >2</text><text x="84" y="240" fill="#202622" font-size="37" font-weight="700" text-anchor="start" >会话与工具回执</text><text x="84" y="305" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >保留原史，追加恢复事实并重新读文件</text><path d="M84 348H952" class="edge" stroke="#C9CDC2"  /><circle cx="27" cy="394" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="27" y="404" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >3</text><text x="84" y="404" fill="#202622" font-size="37" font-weight="700" text-anchor="start" >运行日志</text><text x="84" y="469" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >调用 ID 关联元信息，不写入文件正文</text><path d="M84 512H952" class="edge" stroke="#C9CDC2"  /><circle cx="27" cy="558" r="24" fill="#202622" stroke="#202622" stroke-width="3"/><text x="27" y="568" fill="#F4F1EA" font-size="28" font-weight="700" text-anchor="middle" >4</text><text x="84" y="568" fill="#B53830" font-size="37" font-weight="700" text-anchor="start" >命令、人工终端与外部服务</text><text x="84" y="633" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >不捕获任意 shell，也不撤销外部请求</text><path d="M84 676H952" class="edge" stroke="#C9CDC2"  /><text x="0" y="756" fill="#28614D" font-size="31" font-weight="650" text-anchor="start" >按一次文件工具调用记录，不是整轮时间旅行。</text></svg><p class="explain" data-block data-prose>三类记录通过 operationId / toolCallId 关联。独立 CLI 回退不改写其他会话；/new、取消与恢复会话也不会回退文件。</p></div></main></body></html>
