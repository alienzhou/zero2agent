<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>先限制块大小，再计算内容地址</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="07"><header class="page-header"><span>Zero2Agent · 分块算法</span><span class="page-number">07</span></header><div class="heading" data-block><h1>先限制块大小，<br>再计算内容地址</h1><p class="deck" data-prose>本课用有上下界的 Gear 滚动哈希。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="数据字节经过滚动哈希，最小16KiB掩码命中或者最大256KiB时切块，随后SHA256压缩去重"><title>数据字节经过滚动哈希，最小16KiB掩码命中或者最大256KiB时切块，随后SHA256压缩去重</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="20" width="952" height="112" rx="12" fill="#FFFEF9" stroke="#202622" stroke-width="2" /><text x="32" y="87" fill="#202622" font-size="30" font-weight="650" text-anchor="start" class="mono">rolling = (rolling &lt;&lt; 1) + gear[byte]</text><path d="M476 152V215" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="0" y="236" width="952" height="167" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="30" y="299" fill="#28614D" font-size="34" font-weight="650" text-anchor="start" >至少 16 KiB 后，低 16 位为零可切块</text><text x="30" y="363" fill="#202622" font-size="33" font-weight="400" text-anchor="start" >到 256 KiB 必须切块；末块可以更小</text><path d="M476 424V487" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="0" y="512" width="294" height="95" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="147" y="573" fill="#202622" font-size="31" font-weight="650" text-anchor="middle" >SHA-256</text><rect x="329" y="512" width="294" height="95" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="476" y="573" fill="#202622" font-size="31" font-weight="650" text-anchor="middle" >deflate 3</text><rect x="658" y="512" width="294" height="95" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="805" y="573" fill="#202622" font-size="31" font-weight="650" text-anchor="middle" >只存新块</text><text x="0" y="697" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >哈希负责校验与寻址；滚动哈希只决定边界。</text><text x="0" y="757" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >压缩后的块仍需限制解压后的最大长度。</text></svg><p class="explain" data-block data-prose>64 KiB 是边界掩码对应的量级，不是每块都恰好 64 KiB，也不是含最小长度后的严格平均值。</p></div></main></body></html>
