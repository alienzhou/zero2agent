<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>E02-S002 · 当前边界</title><link rel="stylesheet" href="course.css"></head><body><article class="sheet" data-page="15"><header class="page-header" data-block><span>Zero2Agent · 工程边界</span><span class="page-number">15</span></header><div class="heading" data-block><h1>匹配成功后，还要核对结果</h1><p class="deck" data-prose>当前实现解决了定位，仍有这些边界</p></div><main class="content"><section class="boundary" data-block><h2>路径：拦住越界，软链接需另处理</h2><p data-prose>复用工作区路径校验，拒绝 <code>../</code> 等路径逃逸。它没有解析软链接的真实目标，不能当作完整文件系统沙箱。</p></section><section class="boundary" data-block><h2>并发：没有文件锁和版本检查</h2><p data-prose>执行过程是先读后写。若其他进程在期间修改文件，本版没有冲突检测，也没有自动回滚。</p></section><section class="boundary" data-block><h2>语义：文本改对了，代码未必正确</h2><p data-prose>成功回执只确认完成替换。还要查看实际 diff、编译或运行相关测试，才能判断改动是否符合需求。</p></section><p class="note" data-block data-prose>本课只做一次确定性字符串修改。权限确认、回滚和更完整的编辑验证，需要额外的宿主能力。</p></main></article></body></html>
