<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>E02-S002 · 参数</title><link rel="stylesheet" href="course.css"></head><body><article class="sheet" data-page="06"><header class="page-header" data-block><span>Zero2Agent · 工具接口</span><span class="page-number">06</span></header><div class="heading" data-block><h1>先告诉工具，哪里要改</h1><p class="deck" data-prose>三个必填参数，把一次修改说具体</p></div><main class="content"><div class="param-list" data-block><div class="param-row"><code>path</code><div><h2>哪一个文件</h2><p data-prose>相对工作区解析目标路径。</p><p class="value">config.ts</p></div></div><div class="param-row"><code>old_string</code><div><h2>找到哪一段原文</h2><p data-prose>连空格和换行都要精确一致。</p><p class="value">apiTimeout = 30</p></div></div><div class="param-row"><code>new_string</code><div><h2>换成哪一段新内容</h2><p data-prose>只描述这次需要改变的片段。</p><p class="value">apiTimeout = 60</p></div></div></div><section class="request" data-block><h2><code>replace_all</code> 是可选开关</h2><p data-prose>省略时默认为关闭。工具会要求原文只出现一次，避免一处请求改到多个位置。</p></section></main></article></body></html>
