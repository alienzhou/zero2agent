<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>E02-S002 · 唯一匹配</title><link rel="stylesheet" href="course.css"></head><body><article class="sheet" data-page="07"><header class="page-header" data-block><span>Zero2Agent · 核心规则</span><span class="page-number">07</span></header><div class="heading" data-block><h1>找到一次，才允许修改</h1><p class="deck" data-prose>默认模式：先统计原文的匹配次数</p></div><main class="content"><div data-block><div class="decision-head">匹配次数 → 工具行为 → 调用方接下来做什么</div><div class="decision"><span class="count">0</span><h2>未找到</h2><div><p data-prose>不写文件，检查原文。</p><small>Match not found</small></div></div><div class="decision"><span class="count">1</span><h2>唯一匹配</h2><div><p data-prose>替换这一处，报告成功。</p><small>Replaced … (1 occurrence)</small></div></div><div class="decision"><span class="count">2+</span><h2>匹配不唯一</h2><div><p data-prose>不写文件，补定位上下文。</p><small>Match not unique</small></div></div></div><div class="request" data-block><p data-prose>工具不会自动挑第一个。<br>出现多处，就把问题交回调用方。</p></div><p class="note" data-block data-prose>这里只解决“匹配是否唯一”。匹配到唯一文本，还需要确认它符合用户的修改意图。</p></main></article></body></html>
