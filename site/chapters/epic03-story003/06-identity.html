<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>别用工具名称，去更新一张工具卡</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="06"><header class="page-header"><span>Zero2Agent · 事件身份</span><span class="page-number">06</span></header><div class="heading" data-block><h1>别用工具名称，<br>去更新一张工具卡</h1><p class="deck" data-prose>一个 Turn 里，同名工具可以执行很多次。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="相同write_file名称对应first和second两个工具调用，不同turn允许复用调用ID，seq只决定同轮事件顺序"><title>相同write_file名称对应first和second两个工具调用，不同turn允许复用调用ID，seq只决定同轮事件顺序</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="12" width="952" height="100" rx="12" fill="#202622" stroke="#202622" stroke-width="2" /><text x="30" y="74" fill="#F4F1EA" font-size="39" font-weight="650" text-anchor="start" class="mono">事件身份 = turnId + toolCallId</text><text x="22" y="174" fill="#202622" font-size="35" font-weight="700" text-anchor="start" >Turn A</text><path d="M173 161H930" class="edge" stroke="#C9CDC2"  /><rect x="28" y="210" width="355" height="120" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="57" y="257" fill="#B53830" font-size="34" font-weight="650" text-anchor="start" class="mono">write_file</text><text x="57" y="306" fill="#B53830" font-size="29" font-weight="400" text-anchor="start" class="mono">toolCallId: first</text><rect x="28" y="368" width="355" height="120" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="57" y="415" fill="#28614D" font-size="34" font-weight="650" text-anchor="start" class="mono">write_file</text><text x="57" y="464" fill="#28614D" font-size="28" font-weight="400" text-anchor="start" class="mono">toolCallId: second</text><path d="M397 267H524" class="edge" stroke="#B53830" marker-end="url(#red)" /><path d="M397 425H524" class="edge" stroke="#28614D" marker-end="url(#green)" /><rect x="546" y="235" width="360" height="50" rx="25" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="726" y="270" fill="#B53830" font-size="28" font-weight="650" text-anchor="middle" >first → 已拒绝</text><rect x="546" y="392" width="360" height="50" rx="25" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="726" y="427" fill="#28614D" font-size="28" font-weight="650" text-anchor="middle" >second → 已完成</text><text x="534" y="342" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >名称相同，结果各自归属</text><rect x="0" y="531" width="952" height="125" rx="12" fill="#E7EADF" stroke="#C9CDC2" stroke-width="2" /><text x="28" y="579" fill="#202622" font-size="33" font-weight="650" text-anchor="start" class="mono">Turn B · first</text><text x="28" y="625" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >即使调用 ID 再出现，也属于新的运行。</text><path d="M68 722H881" class="edge" stroke="#202622" marker-end="url(#ink)" /><circle cx="125" cy="722" r="23" fill="#F4F1EA" stroke="#202622" stroke-width="3"/><text x="125" y="731" fill="#202622" font-size="26" font-weight="650" text-anchor="middle" >1</text><circle cx="345" cy="722" r="23" fill="#F4F1EA" stroke="#202622" stroke-width="3"/><text x="345" y="731" fill="#202622" font-size="26" font-weight="650" text-anchor="middle" >2</text><circle cx="565" cy="722" r="23" fill="#F4F1EA" stroke="#202622" stroke-width="3"/><text x="565" y="731" fill="#202622" font-size="26" font-weight="650" text-anchor="middle" >3</text><circle cx="785" cy="722" r="23" fill="#F4F1EA" stroke="#202622" stroke-width="3"/><text x="785" y="731" fill="#202622" font-size="26" font-weight="650" text-anchor="middle" >4</text><text x="476" y="783" fill="#596057" font-size="29" font-weight="400" text-anchor="middle" >seq：同一轮内递增，过滤重复或迟到事件</text></svg><p class="explain" data-block data-prose>turnId 确定运行，toolCallId 确定工具，seq 确定已处理顺序。三者解决的问题不同。</p></div></main></body></html>
