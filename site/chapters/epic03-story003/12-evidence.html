<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>停止后续操作，不抹掉已经发生的结果</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="12"><header class="page-header"><span>Zero2Agent · 取消后的证据</span><span class="page-number">12</span></header><div class="heading" data-block><h1>停止后续操作，<br>不抹掉已经发生的结果</h1><p class="deck" data-prose>取消不会撤销文件，也不能留下未配对的工具调用。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="已完成调用A保留成功结果和磁盘文件，取消后未开始的调用B返回取消错误且不执行，两者都配对"><title>已完成调用A保留成功结果和磁盘文件，取消后未开始的调用B返回取消错误且不执行，两者都配对</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" ke="#F4F1EA" stroke-width="2" /><text x="475" y="332" fill="#B53830" font-size="35" font-weight="700" text-anchor="middle" >用户取消当前轮</text><rect x="0" y="402" width="352" height="176" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2" /><text x="25" y="450" fill="#896016" font-size="31" font-weight="650" text-anchor="start" class="mono">B · terminal</text><text x="25" y="503" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >尚未开始</text><text x="25" y="551" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >停止后续调度</text><path d="M366 489H565" class="edge" stroke="#896016" marker-end="url(#amber)" /><text x="472" y="453" fill="#896016" font-size="29" font-weight="600" text-anchor="middle" >同一 ID</text><rect x="586" y="402" width="365" height="176" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2" /><text x="613" y="462" fill="#896016" font-size="33" font-weight="650" text-anchor="start" >B · 取消回执</text><text x="613" y="536" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >未执行也有配对结果</text><path d="M92 636h51l22 22v89h-73Z M143 636v22h22" fill="#FFFEF9" stroke="#28614D" stroke-width="3"/><path d="M110 680.4h37M110 700.38h37M110 720.36h25" class="edge" stroke="#28614D"  /><text x="209" y="683" fill="#28614D" font-size="36" font-weight="650" text-anchor="start" >saved.txt 仍在磁盘上</text><text x="209" y="738" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >要恢复文件，需要另一个明确的操作。</text></svg><p class="explain" data-block data-prose>保留已完成的证据，也说明哪些动作未执行。下一轮才能从真实中断点继续，而不是误以为全部回滚。</p></div></main></body></html>
