<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>审批等待期间，工具还没有运行</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="08"><header class="page-header"><span>Zero2Agent · 工具状态</span><span class="page-number">08</span></header><div class="heading" data-block><h1>审批等待期间，<br>工具还没有运行</h1><p class="deck" data-prose>先识别调用，再等权限，通过后才进入 running。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="工具主路径pending到approval到running到completed，审批拒绝进入denied，执行失败进入error，未开始且取消进入cancelled"><title>工具主路径pending到approval到running到completed，审批拒绝进入denied，执行失败进入error，未开始且取消进入cancelled</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="17" y="115" width="251" height="124" rx="12" fill="#E7EADF" stroke="#202622" stroke-width="2" /><text x="143" y="168" fill="#202622" font-size="32" font-weight="650" text-anchor="middle" class="mono">pending</text><text x="143" y="215" fill="#596057" font-size="29" font-weight="400" text-anchor="middle" >已收到调用</text><rect x="301" y="115" width="251" height="124" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2" /><text x="427" y="168" fill="#896016" font-size="32" font-weight="650" text-anchor="middle" class="mono">approval</text><text x="427" y="215" fill="#596057" font-size="29" font-weight="400" text-anchor="middle" >等待用户回答</text><rect x="586" y="115" width="251" height="124" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="712" y="168" fill="#28614D" font-size="32" font-weight="650" text-anchor="middle" class="mono">running</text><text x="712" y="215" fill="#596057" font-size="29" font-weight="400" text-anchor="middle" >实际开始执行</text><path d="M270 177H295" class="edge" stroke="#896016" marker-end="url(#amber)" /><path d="M554 177H579" class="edge" stroke="#28614D" marker-end="url(#green)" /><text x="566" y="112" fill="#28614D" font-size="27" font-weight="600" text-anchor="middle" >批准</text><path d="M427 241V364" class="edge" stroke="#B53830" marker-end="url(#red)" /><text x="463" y="310" fill="#B53830" font-size="29" font-weight="600" text-anchor="start" >拒绝</text><rect x="282" y="380" width="290" height="50" rx="25" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="427" y="415" fill="#B53830" font-size="28" font-weight="650" text-anchor="middle" >denied · 已拒绝</text><path d="M712 241V460" class="edge" stroke="#28614D"  /><path d="M712 460H290V518" class="edge" stroke="#28614D" marker-end="url(#green)" /><path d="M712 460V518" class="edge" stroke="#B53830" marker-end="url(#red)" /><rect x="77" y="533" width="365" height="50" rx="25" fill="#E0EBDF" stroke="#28614D" stroke-width="2" /><text x="259.5" y="568" fill="#28614D" font-size="28" font-weight="650" text-anchor="middle" >completed · 已完成</text><rect x="514" y="533" width="365" height="50" rx="25" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="696.5" y="568" fill="#B53830" font-size="28" font-weight="650" text-anchor="middle" >error · 执行出错</text><rect x="0" y="639" width="952" height="126" rx="12" fill="#E7EADF" stroke="#C9CDC2" stroke-width="2" /><text x="30" y="687" fill="#896016" font-size="33" font-weight="650" text-anchor="start" >cancelled · 本轮取消而未执行</text><text x="30" y="738" fill="#596057" font-size="32" font-weight="400" text-anchor="start" >未开始的调用停止调度，并留下对应回执。</text></svg><p class="explain" data-block data-prose>自动允许的调用可跳过 approval。已执行工具保留真实结果；取消不会把成功结果改写成“从未发生”。</p></div></main></body></html>
