<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>交给人操作时，TUI 先让出键盘和屏幕</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="16"><header class="page-header"><span>Zero2Agent · 人工终端</span><span class="page-number">16</span></header><div class="heading" data-block><h1>交给人操作时，<br>TUI 先让出键盘和屏幕</h1><p class="deck" data-prose>通用执行批准与人工终端交接，仍然是两层确认。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 790" width="952" height="790" role="img" aria-label="普通TUI先经过权限与交接确认，再暂停绘制和输入交给人工PTY，结束状态返回Core，原界面恢复"><title>普通TUI先经过权限与交接确认，再暂停绘制和输入交给人工PTY，结束状态返回Core，原界面恢复</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="19" width="952" height="91" rx="12" fill="#E7EADF" stroke="#202622" stroke-width="2" /><text x="476" y="76" fill="#202622" font-size="36" font-weight="650" text-anchor="middle" >通用权限批准 → 人工交接确认</text><path d="M476 113V170" class="edge" stroke="#896016" marker-end="url(#amber)" /><rect x="0" y="183" width="367" height="317" rx="12" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2" /><text x="183" y="242" fill="#202622" font-size="37" font-weight="700" text-anchor="middle" >Agent TUI</text><text x="183" y="321" fill="#596057" font-size="33" font-weight="400" text-anchor="middle" >暂停输入监听</text><text x="183" y="386" fill="#596057" font-size="33" font-weight="400" text-anchor="middle" >暂停界面重绘</text><text x="183" y="451" fill="#596057" font-size="33" font-weight="400" text-anchor="middle" >保存草稿</text><path d="M382 337H571" class="edge" stroke="#896016" marker-end="url(#amber)" /><text x="476" y="283" fill="#896016" font-size="30" font-weight="650" text-anchor="middle" >独占交接</text><rect x="586" y="183" width="366" height="317" rx="12" fill="#202622" stroke="#202622" stroke-width="2" /><text x="769" y="242" fill="#F4F1EA" font-size="37" font-weight="700" text-anchor="middle" >Human PTY</text><text x="769" y="321" fill="#F4F1EA" font-size="33" font-weight="400" text-anchor="middle" >人直接输入</text><text x="769" y="386" fill="#F4F1EA" font-size="33" font-weight="400" text-anchor="middle" >人查看终端正文</text><text x="769" y="451" fill="#F4F1EA" font-size="33" font-weight="400" text-anchor="middle" >结束后退出</text><path d="M769 503V575H183V509" class="edge" stroke="#28614D" marker-end="url(#green)" /><text x="476" y="559" fill="#28614D" font-size="30" font-weight="650" text-anchor="middle" >恢复终端模式、重绘、归还草稿</text><rect x="0" y="646" width="952" height="126" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2" /><text x="31" y="694" fill="#B53830" font-size="36" font-weight="650" text-anchor="start" >模型只收到终端状态摘要</text><text x="31" y="743" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >人工输入、密码和完整终端正文不进入模型对话。</text></svg><p class="explain" data-block data-prose>交接期间 Ctrl-C 等字节属于人工终端规则。两个输入监听器同时读取，会吞字、误操作，甚至泄露私密输入。</p></div></main></body></html>
