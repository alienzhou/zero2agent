<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>SDK 也在重试，外层再试会发生什么？</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="05"><header class="page-header"><span>Zero2Agent · 让次数可解释</span><span class="page-number">05</span></header><div class="heading" data-block><h1>SDK 也在重试，<br>外层再试会发生什么？</h1><p class="deck" data-prose>由一层拥有传输策略，另一层只执行一次。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 760" width="952" height="760" role="img" aria-label="内外各重试两次可能得到九次传输，本课关闭SDK重试由Harness控制最多三次"><title>内外各重试两次可能得到九次传输，本课关闭SDK重试由Harness控制最多三次</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="20" width="952" height="245" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="24" y="71" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >假设两层都重试 2 次</text><text x="24" y="128" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >外层最多 3 次 × SDK 每次最多 3 次</text><text x="24" y="178" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >理论最多 9 次传输，不是本项目旧版实测。</text><path d="M476 285V345" fill="none" stroke="#28614D" stroke-width="3.5" stroke-linecap="round" marker-end="url(#green)"/><rect x="0" y="365" width="952" height="260" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="24" y="416" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >本课的策略</text><text x="24" y="473" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >SDK maxRetries = 0</text><text x="24" y="523" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >Harness：尝试 1 → 尝试 2 → 尝试 3</text><text x="24" y="573" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >每次尝试都有独立证据和预算。</text><text x="0" y="710" fill="#596057" font-size="32" font-weight="400" text-anchor="start" >模型、摘要、provider 计数共用执行器。</text></svg><p class="explain" data-block data-prose>固定 npm SDK 0.52.0 默认重试两次；本课显式关闭它。不要由调用函数次数推断原有 SDK 的实际 HTTP 次数。</p></div></main></body></html>
