<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>时间到了，为什么还不能立刻再问？</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="16"><header class="page-header"><span>Zero2Agent · 停止前要等结算</span><span class="page-number">16</span></header><div class="heading" data-block><h1>时间到了，<br>为什么还不能立刻再问？</h1><p class="deck" data-prose>工具可能忽略取消，并在稍后完成写入。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 760" width="952" height="760" role="img" aria-label="工具开始后到时间预算，保持输入忙直到工具真实结算并记录效果，之后开放新Turn"><title>工具开始后到时间预算，保持输入忙直到工具真实结算并记录效果，之后开放新Turn</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="15" width="952" height="150" rx="12" fill="#FFFEF9" stroke="#202622" stroke-width="2"/><text x="24" y="66" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >工具开始执行</text><text x="24" y="123" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >signal 交给工具；宿主持有输入。</text><path d="M476 175V190" fill="none" stroke="#202622" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ink)"/><rect x="0" y="200" width="952" height="150" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="24" y="251" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >时间预算到达</text><text x="24" y="308" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >不启动新工作，发送取消信号。</text><path d="M476 360V375" fill="none" stroke="#B53830" stroke-width="3.5" stroke-linecap="round" marker-end="url(#red)"/><rect x="0" y="385" width="952" height="150" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2"/><text x="24" y="436" fill="#896016" font-size="36" font-weight="700" text-anchor="start" >工具真实结束</text><text x="24" y="493" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >读取并保存实际结果，不假装回滚。</text><path d="M476 545V560" fill="none" stroke="#896016" stroke-width="3.5" stroke-linecap="round" marker-end="url(#amber)"/><rect x="0" y="570" width="952" height="150" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="24" y="621" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >开放下一轮输入</text><text x="24" y="678" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >新 Turn 有新的预算，已有效果仍在。</text></svg><p class="explain" data-block data-prose>时序为机制示意。测试用不配合 signal 的工具证明：前一轮未结算时，新 run 仍拒绝；结算后的真实写入结果保留。</p></div></main></body></html>
