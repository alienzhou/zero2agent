<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>一次 Turn，分别数四种消耗</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="13"><header class="page-header"><span>Zero2Agent · 给运行设置边界</span><span class="page-number">13</span></header><div class="heading" data-block><h1>一次 Turn，<br>分别数四种消耗</h1><p class="deck" data-prose>不要只用“聊了多少轮”解释成本。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 760" width="952" height="760" role="img" aria-label="四项默认预算为20迭代100实际请求64工具调用600秒整轮，重试和工具批次分别计数"><title>四项默认预算为20迭代100实际请求64工具调用600秒整轮，重试和工具批次分别计数</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF 0" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="526" y="376" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >600000ms</text><text x="526" y="433" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >从本轮开始计时</text><text x="526" y="483" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >等待与审批也消耗时间</text><text x="0" y="685" fill="#596057" font-size="32" font-weight="400" text-anchor="start" >相同工具与参数默认失败 3 次后停止。</text><text x="0" y="742" fill="#596057" font-size="32" font-weight="400" text-anchor="start" >每个新 Turn 重新建立预算。</text></svg><p class="explain" data-block data-prose>限制可配置但必须是有界整数。预算正确不等于任务一定成功；实际 token 用量以 SDK 证据为准。</p></div></main></body></html>
