<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>四种消耗，分别计数</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="13"><header class="page-header"><span>Zero2Agent · 12 · 为本轮设置边界</span><span class="page-number">13</span></header><div class="heading" data-block><h1>四种消耗，<br>分别计数</h1><p class="deck" data-prose>实际请求次数、工具次数和推理迭代不能混为一谈。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 780" width="952" height="780" role="img" aria-label="默认预算仪表：20推理迭代100实际请求64工具调用600000毫秒；每项启动前扣额度，相同失败三次停"><title>默认预算仪表：20推理迭代100实际请求64工具调用600000毫秒；每项启动前扣额度，相同失败三次停</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="132" fill="#202622" font-size="100" font-weight="700" text-anchor="start" >20</text><text x="0" y="215" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >推理迭代</text><path d="M0 242h450" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round"  /><text x="0" y="285" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >模型与工具的循环</text><text x="0" y="328" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >重试不另算迭代</text><text x="502" y="132" fill="#28614D" font-size="100" font-weight="700" text-anchor="start" >100</text><text x="502" y="215" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >实际请求</text><path d="M502 242h450" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round"  /><text x="502" y="285" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >model + summary + count</text><text x="502" y="328" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >每个 attempt 都扣额度</text><text x="0" y="473" fill="#896016" font-size="100" font-weight="700" text-anchor="start" >64</text><text x="0" y="556" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >工具调用</text><path d="M0 583h450" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round"  /><text x="0" y="626" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >被拒和未知调用也计入</text><text x="0" y="669" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >开始前判断能否执行</text><text x="502" y="473" fill="#B53830" font-size="64" font-weight="700" text-anchor="start" >600000</text><text x="502" y="556" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >整轮毫秒</text><path d="M502 583h450" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round"  /><text x="502" y="626" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >从本轮开始计时</text><text x="502" y="669" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >等待与审批也在其中</text><path d="M0 684h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="734" fill="#202622" font-size="30" font-weight="650" text-anchor="start" >相同失败默认 3 次后停；新 Turn 重新建预算。</text></svg><p class="explain" data-block data-prose>上面是默认上限，不是某次运行的用量。启动操作前消耗额度，失败后的恢复也受剩余时间和次数限制；允许配置有界整数。</p></div></main></body></html>
