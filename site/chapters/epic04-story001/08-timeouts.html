<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>请求时限管响应，整轮时限管新工作</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="08"><header class="page-header"><span>Zero2Agent · 区分两种时限</span><span class="page-number">08</span></header><div class="heading" data-block><h1>请求时限管响应，<br>整轮时限管新工作</h1><p class="deck" data-prose>建立连接之后，流式正文仍然可能一直不结束。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 760" width="952" height="760" role="img" aria-label="Turn十分钟预算包含请求两分钟和工具结算，摘要计数仍有30秒逻辑限制"><title>Turn十分钟预算包含请求两分钟和工具结算，摘要计数仍有30秒逻辑限制</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="20" width="952" height="675" rx="12" fill="#FFFEF9" stroke="#202622" stroke-width="2"/><text x="35" y="83" fill="#202622" font-size="39" font-weight="700" text-anchor="start" >Turn 默认 600000ms</text><rect x="35" y="130" width="882" height="205" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="59" y="181" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >一次请求默认 120000ms</text><text x="59" y="238" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >覆盖连接、等待响应和整段 SSE。</text><text x="59" y="288" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >signal 关闭真实传输，不只停止 spinner。</text><rect x="35" y="380" width="882" height="180" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2"/><text x="59" y="431" fill="#896016" font-size="36" font-weight="700" text-anchor="start" >工具已开始执行</text><text x="59" y="488" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >时间到达：不启动下一项，等待真实结算。</text><text x="35" y="627" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >计数/摘要仍保留 E03 默认 30s 逻辑等待。</text><text x="0" y="747" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >更短的目的时限与剩余整轮时间优先。</text></svg><p class="explain" data-block data-prose>总时间使用单调时钟。任意自定义 JS 若不配合 signal，不能保证在指定毫秒内硬终止。</p></div></main></body></html>
