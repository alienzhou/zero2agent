<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>建立连接，不代表请求已经结束</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="08"><header class="page-header"><span>Zero2Agent · 07 · 两层时钟</span><span class="page-number">08</span></header><div class="heading" data-block><h1>建立连接，<br>不代表请求已经结束</h1><p class="deck" data-prose>时限必须覆盖整段 SSE；整轮还包含工具与审批。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 780" width="952" height="780" role="img" aria-label="嵌套时限刻度：Turn默认十分钟包含模型请求工具审批，单次请求默认两分钟覆盖连接响应和流式正文，摘要计数目的限制30秒"><title>嵌套时限刻度：Turn默认十分钟包含模型请求工具审批，单次请求默认两分钟覆盖连接响应和流式正文，摘要计数目的限制30秒</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="60" fill="#202622" font-size="40" font-weight="700" text-anchor="start" >Turn · 默认 10 分钟</text><rect x="0" y="87" width="952" height="452" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="25" y="137" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >从用户提交开始计时</text><rect x="25" y="180" width="576" height="292" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="49" y="232" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >请求 · 默认 2 分钟</text><path d="M65 319H550" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><circle cx="80" cy="319" r="8" fill="#28614D"/><text x="80" y="377" fill="#28614D" font-size="27" font-weight="650" text-anchor="middle" >连接</text><circle cx="244" cy="319" r="8" fill="#28614D"/><text x="244" y="377" fill="#28614D" font-size="27" font-weight="650" text-anchor="middle" >响应头</text><circle cx="478" cy="319" r="8" fill="#28614D"/><text x="478" y="377" fill="#28614D" font-size="27" font-weight="650" text-anchor="middle" >SSE 正文</text><text x="49" y="436" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >超时 → signal 关闭真实传输</text><text x="648" y="255" fill="#202622" font-size="31" font-weight="650" text-anchor="start" >审批等待</text><text x="648" y="322" fill="#202622" font-size="31" font-weight="650" text-anchor="start" >工具执行</text><text x="648" y="409" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >也占整轮时间</text><path d="M0 593h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="654" fill="#202622" font-size="35" font-weight="700" text-anchor="start" >实际允许时间 = 更短的时限</text><text x="0" y="714" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >剩余整轮时间 / 请求时限 / 目的时限</text><text x="0" y="760" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >计数与摘要保留 E03 的 30 秒逻辑限制。</text></svg><p class="explain" data-block data-prose>大小只表达包含关系，不按真实耗时比例绘制。总时间使用单调时钟；请求的可取消传输与任意 JS 工具的结算方式不同。</p></div></main></body></html>
