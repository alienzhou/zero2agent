<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>把运行限制写清，再用日志核对</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="17"><header class="page-header"><span>Zero2Agent · 16 · 配置与追查</span><span class="page-number">17</span></header><div class="heading" data-block><h1>把运行限制写清，<br>再用日志核对</h1><p class="deck" data-prose>flag 覆盖环境默认值；四种 CLI 入口共享策略。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 780" width="952" height="780" role="img" aria-label="CLI三项限制配置与日志attempt解析，坏参数发请求前拒绝，日志只读查看不重放"><title>CLI三项限制配置与日志attempt解析，坏参数发请求前拒绝，日志只读查看不重放</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="257" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="43" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >一次命令 · 也适用于 --plain / 管道 / TUI</text><path d="M24 62h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="108" fill="#F4F1EA" font-size="31" font-weight="400" text-anchor="start" class="mono">--max-retries 2</text><text x="24" y="157" fill="#F4F1EA" font-size="31" font-weight="400" text-anchor="start" class="mono">--max-tool-calls 8</text><text x="24" y="206" fill="#F4F1EA" font-size="31" font-weight="400" text-anchor="start" class="mono">--request-timeout-ms 30000</text><text x="0" y="322" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >配置的检查发生在执行前</text><text x="0" y="377" fill="#B53830" font-size="30" font-weight="650" text-anchor="start" >非法值 → 拒绝启动 → HTTP 请求数为 0</text><path d="M0 424h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><rect x="0" y="467" width="952" height="186" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="510" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >/logs → Enter → /log · 只读查看</text><path d="M24 529h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="575" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">logical=L · req=C · attempt=3</text><text x="24" y="624" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">wait=1ms · errorKind=http</text><path d="M118 668V699" fill="none" stroke="#202622" stroke-width="3" stroke-linecap="round" marker-end="url(#ink)" /><path d="M619 668V699" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="0" y="752" fill="#202622" font-size="30" font-weight="650" text-anchor="start" >找同一逻辑请求</text><text x="506" y="752" fill="#28614D" font-size="30" font-weight="650" text-anchor="start" >核对实际尝试与等待</text></svg><p class="explain" data-block data-prose>这里是当前字段的教学重排，UUID 已缩写。完整九项 flag 与环境变量见跟练；读取日志不触发任何模型请求或工具重放。</p></div></main></body></html>
