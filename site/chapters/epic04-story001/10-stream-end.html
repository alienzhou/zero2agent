<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>参数看起来完整，工具也不能马上执行</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="10"><header class="page-header"><span>Zero2Agent · 09 · 流结束的提交边界</span><span class="page-number">10</span></header><div class="heading" data-block><h1>参数看起来完整，<br>工具也不能马上执行</h1><p class="deck" data-prose>显示草稿、提交会话、执行工具，是三个不同动作。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 770" width="952" height="770" role="img" aria-label="SSE文本参数片段暂存为草稿，完整message_stop后检查stop_reason才可授权执行，缺少终态断流则标记草稿不执行"><title>SSE文本参数片段暂存为草稿，完整message_stop后检查stop_reason才可授权执行，缺少终态断流则标记草稿不执行</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="255" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="43" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >SSE · 可以故意制造的半截流</text><path d="M24 62h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="108" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">text_delta: &quot;准备写文件…&quot;</text><text x="24" y="157" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">input_json_delta: {&quot;path&quot;:&quot;effect.txt&quot;}</text><text x="24" y="206" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">连接断开；没有 message_stop</text><path d="M240 286V336" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><path d="M715 286V336" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><text x="18" y="397" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >完整回复的路径</text><text x="516" y="397" fill="#B53830" font-size="34" font-weight="700" text-anchor="start" >缺少结束的路径</text><rect x="0" y="432" width="454" height="183" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="24" y="482" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >message_stop 已观察到</text><text x="24" y="530" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >stop_reason == tool_use</text><text x="24" y="578" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >再次授权 → 执行 → 配对结果</text><rect x="498" y="432" width="454" height="183" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="522" y="482" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >标记：未完成草稿</text><text x="522" y="530" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >不提交正式 assistant 历史</text><text x="522" y="578" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >工具执行次数 = 0</text><path d="M0 669h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="725" fill="#202622" font-size="28" font-weight="600" text-anchor="start" class="mono">if (!stopped) throw new IncompleteStreamError()</text></svg><p class="explain" data-block data-prose>顶部是教学流片段；完整路径是另一个可能结果。测试故意发送表面完整的参数后断流，确认文件未写、历史不收半截。</p></div></main></body></html>
