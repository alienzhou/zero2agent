<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>一次拒绝，不能反复弹窗求批准</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="12"><header class="page-header"><span>Zero2Agent · 拒绝不是网络故障</span><span class="page-number">12</span></header><div class="heading" data-block><h1>一次拒绝，<br>不能反复弹窗求批准</h1><p class="deck" data-prose>新的操作继续遵守当前权限，拒绝记录不会升级为授权。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 760" width="952" height="760" role="img" aria-label="权限拒绝回执保留，再次同工具同参数会停止，不同允许操作仍需重新授权"><title>权限拒绝回执保留，再次同工具同参数会停止，不同允许操作仍需重新授权</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="10" width="952" height="205" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="24" y="61" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >write_file 的请求被拒绝</text><text x="24" y="118" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >配对为 is_error；不执行，不捕获文件。</text><path d="M250 230V280" fill="none" stroke="#B53830" stroke-width="3.5" stroke-linecap="round" marker-end="url(#red)"/><path d="M710 230V280" fill="none" stroke="#28614D" stroke-width="3.5" stroke-linecap="round" marker-end="url(#green)"/><rect x="0" y="300" width="450" height="275" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="24" y="351" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >同一 Turn 又试原调用</text><text x="24" y="408" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >同工具 + 同参数</text><text x="24" y="458" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >停止 repeated-denial</text><text x="24" y="508" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >不重新打开审批。</text><rect x="502" y="300" width="450" height="275" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="526" y="351" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >选择允许的替代操作</text><text x="526" y="408" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >作为新的工具调用</text><text x="526" y="458" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >重新判断权限</text><text x="526" y="508" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >不能绕过拒绝规则。</text><text x="0" y="695" fill="#596057" font-size="31" font-weight="400" text-anchor="start" >下一条明确用户请求开始新的 Turn 和预算。</text></svg><p class="explain" data-block data-prose>失败签名只在本轮内存中保留哈希，不进入日志或会话；它不是跨会话的永久授权或永久禁用规则。</p></div></main></body></html>
