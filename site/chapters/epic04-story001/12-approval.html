<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>拒绝一次，不该反复弹窗求批准</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="12"><header class="page-header"><span>Zero2Agent · 11 · 拒绝也有终点</span><span class="page-number">12</span></header><div class="heading" data-block><h1>拒绝一次，<br>不该反复弹窗求批准</h1><p class="deck" data-prose>同一 Turn 记住拒绝，替代方案仍重新判断权限。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 780" width="952" height="780" role="img" aria-label="一次操作拒绝后，同工具同参数再次提出会停止repeated-denial不再次审批，不同输入的替代操作重新走权限流程"><title>一次操作拒绝后，同工具同参数再次提出会停止repeated-denial不再次审批，不同输入的替代操作重新走权限流程</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><polygon points="86,30 217,30 280,93 280,224 217,287 86,287 23,224 23,93" fill="#B53830"/><text x="151" y="143" fill="#F4F1EA" font-size="55" font-weight="700" text-anchor="middle" >拒绝</text><text x="151" y="204" fill="#F4F1EA" font-size="32" font-weight="650" text-anchor="middle" >一次</text><text x="334" y="99" fill="#202622" font-size="38" font-weight="700" text-anchor="start" >不执行 write_file</text><text x="334" y="168" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >错误结果与原调用配对。</text><text x="334" y="221" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >拒绝不会变成授权，也不捕获文件。</text><path d="M0 339h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="418" fill="#B53830" font-size="33" font-weight="700" text-anchor="start" >又提出同工具 + 同参数</text><path d="M470 405H655" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><text x="682" y="418" fill="#B53830" font-size="33" font-weight="700" text-anchor="start" >停止本轮</text><text x="0" y="474" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >repeated-denial · 不再打开相同审批</text><path d="M0 530h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="603" fill="#28614D" font-size="33" font-weight="700" text-anchor="start" >提出不同的替代操作</text><path d="M440 590H627" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="651" y="603" fill="#28614D" font-size="33" font-weight="700" text-anchor="start" >重新授权</text><text x="0" y="658" fill="#596057" font-size="30" font-weight="400" text-anchor="start" >不同参数不代表默认允许，更不能绕过硬边界。</text><text x="0" y="759" fill="#202622" font-size="30" font-weight="650" text-anchor="start" >下一条明确用户请求，建立新的 Turn 预算。</text></svg><p class="explain" data-block data-prose>失败签名只在本轮内存保留哈希，不是跨会话永久授权或禁用。一般审批与人工终端接管继续使用各自的控制接口。</p></div></main></body></html>
