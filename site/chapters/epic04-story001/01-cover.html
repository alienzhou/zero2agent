<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>失败后，怎样继续？</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet cover series-cover " data-page="01"><div class="cover-frame"><header class="page-header"><span>Zero2Agent · 健壮性与上下文</span><span class="page-number">E04-S001</span></header><div class="series-masthead" data-block><h1 class="series-title">从零到一做 <span>Agent</span></h1><p class="series-description" data-prose>亲手实现 Coding Agent · 开源实战课程</p><h2 class="lesson-title">失败恢复与运行预算</h2><p class="lesson-promise" data-prose>文件已经改了，Agent 还能安全继续吗？</p></div><div class="series-body"><svg class="diagram" viewBox="0 0 952 740" width="952" height="740" role="img" aria-label="失败恢复教学示意：文件写入已完成，下一模型请求失败；只恢复传输，保留已有文件效果"><title>失败恢复教学示意：文件写入已完成，下一模型请求失败；只恢复传输，保留已有文件效果</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="8" width="952" height="185" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="51" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >一次任务，在第二次模型请求处中断</text><path d="M24 70h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="116" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">✓ write_file(effect.txt)</text><text x="24" y="165" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">✗ 下一请求：HTTP 500</text><path d="M180 220V282H390" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><path d="M756 220V285" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><path d="M0 315h401l44 44v191h-445Z" fill="#FFFEF9" stroke="#28614D" stroke-width="3"/><path d="M401 315v44h44" fill="none" stroke="#28614D" stroke-width="2"/><text x="22" y="402" fill="#28614D" font-size="30" font-weight="700" text-anchor="start" >effect.txt</text><text x="22" y="464" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >WRITTEN-ONCE</text><text x="22" y="509" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >已完成效果留住</text><text x="555" y="342" fill="#B53830" font-size="33" font-weight="700" text-anchor="start" >500 → 等待 → 再请求</text><text x="555" y="405" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >恢复这一段传输</text><text x="555" y="460" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >不要从头重做任务</text><path d="M0 592h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="643" fill="#596057" font-size="27" font-weight="650" text-anchor="start" >学会三件事</text><text x="0" y="705" fill="#202622" font-size="32" font-weight="650" text-anchor="start" >分清失败位置 · 限制运行成本 · 验证真实效果</text></svg><p class="explain" data-block data-prose>图为教学示意。完整跟练使用本地故障服务、生产 CLI 和真实文件，不需要模型密钥。</p></div><div class="cover-tags"><span>故障实验</span><span>实现拆解</span><span>开源课程</span></div></div></main></body></html>
