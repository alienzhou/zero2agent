<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>先分类，再决定是否重发</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="04"><header class="page-header"><span>Zero2Agent · 哪些错误可以重试</span><span class="page-number">04</span></header><div class="heading" data-block><h1>先分类，<br>再决定是否重发</h1><p class="deck" data-prose>服务错误、鉴权错误和上下文拒绝不能混在一起。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 760" width="952" height="760" role="img" aria-label="重试、停止和上下文缩减三类错误表"><title>重试、停止和上下文缩减三类错误表</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="15" width="952" height="235" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="24" y="66" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >有限传输重试</text><text x="24" y="123" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >408 / 429 / 5xx、连接失败、请求超时</text><text x="24" y="173" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >可识别的流式中断；服务禁止重试时停止。</text><rect x="0" y="280" width="952" height="230" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="24" y="331" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >交还调用者</text><text x="24" y="388" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >400 / 401 / 403 / 404 / 409 / 413 / 422</text><text x="24" y="438" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >协议错误、用户取消、预算耗尽。</text><rect x="0" y="545" width="952" height="190" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2"/><text x="24" y="596" fill="#896016" font-size="36" font-weight="700" text-anchor="start" >上下文拒绝另行处理</text><text x="24" y="653" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >沿用 E03 的有限缩减，同样消耗请求额度。</text></svg><p class="explain" data-block data-prose>分类依据固定 SDK 异常类型、状态和有限 cause 链。本课保守停止 409，不照搬 SDK 的所有重试分支。</p></div></main></body></html>
