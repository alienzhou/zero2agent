/marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="20" width="952" height="170" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="24" y="71" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >① 工具已经结算</text><text x="24" y="128" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >effect.txt = WRITTEN-ONCE</text><path d="M476 205V255" fill="none" stroke="#202622" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ink)"/><rect x="0" y="275" width="952" height="170" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="24" y="326" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >② 下一次模型请求返回 500</text><text x="24" y="383" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >工具结果留在历史里，请求没有完整回复。</text><path d="M476 460V510" fill="none" stroke="#28614D" stroke-width="3.5" stroke-linecap="round" marker-end="url(#green)"/><rect x="0" y="530" width="952" height="190" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="24" y="581" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >③ 重发同一发送视图</text><text x="24" y="638" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >携带原来的工具结果；文件工具不重放。</text><text x="24" y="688" fill="#202622" font-size="31" font-weight="400" text-anchor="start
