<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>选错恢复位置，就可能重复副作用</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="03"><header class="page-header"><span>Zero2Agent · 02 · 恢复边界</span><span class="page-number">03</span></header><div class="heading" data-block><h1>选错恢复位置，<br>就可能重复副作用</h1><p class="deck" data-prose>同样是“失败”，继续的动作却不一样。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 760" width="952" height="760" role="img" aria-label="分叉比较传输恢复保留既有工具结果，与从头重做可能重复副作用；下方区分三种失败位置"><title>分叉比较传输恢复保留既有工具结果，与从头重做可能重复副作用；下方区分三种失败位置</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="45" fill="#202622" font-size="36" font-weight="700" text-anchor="start" >已经完成写入 → 后续模型请求失败</text><path d="M476 82V128H227V165" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><path d="M476 128H725V165" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="0" y="185" width="454" height="232" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="26" y="239" fill="#B53830" font-size="34" font-weight="700" text-anchor="start" >从头重做整段任务</text><text x="26" y="303" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >再次执行写入、发信或提交…</text><text x="26" y="351" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >已发生的效果可能又发生一次。</text><rect x="498" y="185" width="454" height="232" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="524" y="239" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >重发当前模型请求</text><text x="524" y="303" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >沿用已有工具调用与结果。</text><text x="524" y="351" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >本地执行器不重放旧工具。</text><path d="M0 474h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><circle cx="10" cy="525" r="6" fill="#28614D"/><text x="35" y="535" fill="#28614D" font-size="31" font-weight="700" text-anchor="start" >请求失败</text><text x="255" y="535" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >执行器有限重发</text><circle cx="10" cy="609" r="6" fill="#896016"/><text x="35" y="619" fill="#896016" font-size="31" font-weight="700" text-anchor="start" >工具失败</text><text x="255" y="619" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >错误回给模型，修正后新调用</text><circle cx="10" cy="693" r="6" fill="#B53830"/><text x="35" y="703" fill="#B53830" font-size="31" font-weight="700" text-anchor="start" >整轮耗尽</text><text x="255" y="703" fill="#202622" font-size="30" font-weight="400" text-anchor="start" >停止启动新工作，等待结算</text></svg><p class="explain" data-block data-prose>左侧是错误恢复策略的风险示例，并非旧版本实测。重发请求可能让远端重新计算；本地不重放工具，不代表只计费一次。</p></div></main></body></html>
