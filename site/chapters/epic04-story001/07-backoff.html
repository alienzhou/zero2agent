fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="20" width="952" height="230" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="24" y="71" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >默认指数退避 + 抖动</text><text x="24" y="128" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >第 1 次等待约 375–500ms</text><text x="24" y="178" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >第 2 次等待约 750–1000ms</text><rect x="0" y="285" width="952" height="190" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2"/><text x="24" y="336" fill="#896016" font-size="36" font-weight="700" text-anchor="start" >服务指定 Retry-After</text><text x="24" y="393" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >支持秒、HTTP 日期与 retry-after-ms。</text><rect x="0" y="510" width="952" height="220" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="24" y="561" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >服务要求 30s，但只剩 10s</text><text x="24" y="618" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >停止这次恢复；不能等 10s 就提前重发。</text><text x="24" y="668" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >单次允许等待默认最多 30000ms。</text></svg><p class="explain" data-block data-prose>时间线为默认公式示意。实际等
