<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>等多久，也要有明确上限</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="07"><header class="page-header"><span>Zero2Agent · 06 · 等待策略</span><span class="page-number">07</span></header><div class="heading" data-block><h1>等多久，<br>也要有明确上限</h1><p class="deck" data-prose>退避能缓解瞬时故障，但不能让一次任务无限等下去。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 780" width="952" height="780" role="img" aria-label="默认抖动退避两次等待与服务RetryAfter超过剩余整轮预算时停止的时间比较"><title>默认抖动退避两次等待与服务RetryAfter超过剩余整轮预算时停止的时间比较</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="45" fill="#202622" font-size="32" font-weight="700" text-anchor="start" >默认：最多再试 2 次</text><circle cx="100" cy="161" r="12" fill="#B53830"/><text x="100" y="108" fill="#202622" font-size="29" font-weight="650" text-anchor="middle" >请求 1</text><circle cx="420" cy="161" r="12" fill="#B53830"/><text x="420" y="108" fill="#202622" font-size="29" font-weight="650" text-anchor="middle" >请求 2</text><circle cx="880" cy="161" r="12" fill="#28614D"/><text x="880" y="108" fill="#202622" font-size="29" font-weight="650" text-anchor="middle" >请求 3</text><path d="M122 161H395" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><path d="M443 161H855" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><text x="249" y="227" fill="#896016" font-size="29" font-weight="650" text-anchor="middle" >375–500ms</text><text x="652" y="227" fill="#896016" font-size="29" font-weight="650" text-anchor="middle" >750–1000ms</text><text x="0" y="319" fill="#596057" font-size="26" font-weight="400" text-anchor="start" >示意时序，不按毫秒比例绘制</text><path d="M0 356h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="417" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >如果服务要求 Retry-After: 30s</text><text x="0" y="496" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >服务等待</text><rect x="180" y="462" width="710" height="47" rx="0" fill="#F0E5C9" stroke="none" stroke-width="2"/><text x="862" y="495" fill="#896016" font-size="28" font-weight="650" text-anchor="end" >30s</text><text x="0" y="577" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >整轮剩余</text><rect x="180" y="542" width="237" height="47" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="394" y="575" fill="#B53830" font-size="28" font-weight="650" text-anchor="end" >10s</text><path d="M417 600V641" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><text x="180" y="690" fill="#B53830" font-size="34" font-weight="700" text-anchor="start" >停止恢复，不在 10s 后提前请求</text><text x="180" y="751" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >允许等待也受 maxRetryDelayMs 约束。</text></svg><p class="explain" data-block data-prose>默认抖动系数为 0.75–1。支持秒、HTTP 日期与 retry-after-ms；等待期间可取消。服务指定时长超过允许上限或剩余整轮时间时停止。</p></div></main></body></html>
