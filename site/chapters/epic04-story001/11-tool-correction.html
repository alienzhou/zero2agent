<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>错误先交回模型，修正是一次新调用</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="11"><header class="page-header"><span>Zero2Agent · 工具失败怎样继续</span><span class="page-number">11</span></header><div class="heading" data-block><h1>错误先交回模型，<br>修正是一次新调用</h1><p class="deck" data-prose>工具执行器不会自动改参数，也不会自动重放。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 760" width="952" height="760" role="img" aria-label="读取missing失败配对结果返回模型，模型提出新参数fixed重新授权后成功"><title>读取missing失败配对结果返回模型，模型提出新参数fixed重新授权后成功</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F4F1EA"/></marker><marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596057"/></marker><marker id="line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#C9CDC2"/></marker><marker id="white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFFEF9"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E7EADF"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="greenBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#E0EBDF"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="redBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F2DED7"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker><marker id="amberBg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F0E5C9"/></marker></defs><rect x="0" y="10" width="952" height="165" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="24" y="61" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >① probe(value=bad)</text><text x="24" y="118" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >返回 Error: invalid value，与调用 ID 配对。</text><path d="M476 190V240" fill="none" stroke="#202622" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ink)"/><rect x="0" y="260" width="952" height="160" rx="12" fill="#F0E5C9" stroke="#896016" stroke-width="2"/><text x="24" y="311" fill="#896016" font-size="36" font-weight="700" text-anchor="start" >② 模型收到真实错误结果</text><text x="24" y="368" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >由模型提出 probe(value=fixed)。</text><path d="M476 435V485" fill="none" stroke="#28614D" stroke-width="3.5" stroke-linecap="round" marker-end="url(#green)"/><rect x="0" y="505" width="952" height="215" rx="12" fill="#E0EBDF" stroke="#28614D" stroke-width="2"/><text x="24" y="556" fill="#28614D" font-size="36" font-weight="700" text-anchor="start" >③ 新调用重新过执行边界</text><text x="24" y="613" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >再次授权；写入工具再次捕获 Checkpoint。</text><text x="24" y="663" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >实测修正参数后成功，原失败记录保留。</text></svg><p class="explain" data-block data-prose>probe 是故障测试的自定义工具，不是新增生产工具。修正改变输入；持续相同失败则会被运行预算停止。</p></div></main></body></html>
