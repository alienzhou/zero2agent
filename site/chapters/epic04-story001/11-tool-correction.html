<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>失败参数不重放，修正参数才是新调用</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="11"><header class="page-header"><span>Zero2Agent · 10 · 工具错误回给模型</span><span class="page-number">11</span></header><div class="heading" data-block><h1>失败参数不重放，<br>修正参数才是新调用</h1><p class="deck" data-prose>传输执行器不替模型猜怎样修工具输入。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 780" width="952" height="780" role="img" aria-label="模型与自定义工具交替对话：bad参数错误与原ID配对，fixed参数重新授权后成功；新输入是新调用"><title>模型与自定义工具交替对话：bad参数错误与原ID配对，fixed参数重新授权后成功；新输入是新调用</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="200" height="48" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="15" y="33" fill="#202622" font-size="26" font-weight="650" text-anchor="start" >模型的新调用</text><rect x="699" y="0" width="253" height="48" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="714" y="33" fill="#202622" font-size="26" font-weight="650" text-anchor="start" >工具的真实回执</text><rect x="0" y="91" width="619" height="104" rx="0" fill="#E7EADF" stroke="none" stroke-width="2"/><text x="23" y="154" fill="#202622" font-size="31" font-weight="600" text-anchor="start" class="mono">probe({ value: &quot;bad&quot; })</text><path d="M651 143H903V224" fill="none" stroke="#B53830" stroke-width="3" stroke-linecap="round" marker-end="url(#red)" /><rect x="286" y="244" width="666" height="137" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="310" y="293" fill="#B53830" font-size="27" font-weight="650" text-anchor="start" >tool_use_id: 原调用 ID</text><text x="310" y="348" fill="#202622" font-size="31" font-weight="500" text-anchor="start" class="mono">Error: invalid value</text><path d="M264 313H45V420" fill="none" stroke="#896016" stroke-width="3" stroke-linecap="round" marker-end="url(#amber)" /><rect x="0" y="437" width="619" height="104" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="23" y="500" fill="#28614D" font-size="31" font-weight="600" text-anchor="start" class="mono">probe({ value: &quot;fixed&quot; })</text><path d="M651 489H903V583" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="321" y="637" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >重新授权 → 执行成功</text><path d="M0 701h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="758" fill="#202622" font-size="31" font-weight="650" text-anchor="start" >变化的是输入；保留的是第一次失败事实。</text></svg><p class="explain" data-block data-prose>probe 是故障测试中的自定义工具。受保护的写入操作仍通过 Checkpoint；同工具同输入持续失败到阈值时停止，不无限问模型。</p></div></main></body></html>
