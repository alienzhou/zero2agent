" y="581" fill="#202622" font-size="36" font-weight="650" text-anchor="middle" >call C</text><path d="M318 570H465" fill="none" stroke="#B53830" stroke-width="3.5" stroke-linecap="round" marker-end="url(#red)"/><rect x="487" y="510" width="465" height="120" rx="12" fill="#F2DED7" stroke="#B53830" stroke-width="2"/><text x="510" y="581" fill="#B53830" font-size="31" font-weight="650" text-anchor="start" >未执行：停止后续工作</text><text x="0" y="728" fill="#596057" font-size="32" font-weight="400" text-anchor="start" >三份调用，三份结果；A 的文件效果仍保留。</text></svg><p class="explain" data-block data-prose>配对之后才向上报告预算错误，Session 保留失败事实。未来续跑也不能把 B/C 的未执行推断为 A 没有发生。</p></div></main></body></html>
