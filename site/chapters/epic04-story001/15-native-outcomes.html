<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>命令没写 Error:，退出 7 仍然是失败</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet  " data-page="15"><header class="page-header"><span>Zero2Agent · 14 · 不从展示文字猜成功</span><span class="page-number">15</span></header><div class="heading" data-block><h1>命令没写 Error:，<br>退出 7 仍然是失败</h1><p class="deck" data-prose>原生接口给出事实，stdout 只负责展示。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 810" width="952" height="810" role="img" aria-label="真实终端命令退出7，metadata terminalOutcome completed但exitCode7为工具失败，相同命令两次后停止，calls.txt两行"><title>真实终端命令退出7，metadata terminalOutcome completed但exitCode7为工具失败，相同命令两次后停止，calls.txt两行</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="211" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="43" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >生产 terminal · 真实进程</text><path d="M24 62h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="108" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start" class="mono">printf &quot;run\n&quot; &gt;&gt; calls.txt; exit 7</text><text x="24" y="157" fill="#F4F1EA" font-size="28" font-weight="400" text-anchor="start"
