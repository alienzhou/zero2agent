<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>看到文件存在，仍要判断它是谁改的</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="08"><header class="page-header"><span>Zero2Agent · 07 · 核对已有文件保护</span><span class="page-number">08</span></header><div class="heading" data-block><h1>看到文件存在，<br>仍要判断它是谁改的</h1><p class="deck" data-prose>使用关联的 Checkpoint 查看差异与中断写入。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="写入前、记录的写入后、当前人工编辑版本并列"><title>写入前、记录的写入后、当前人工编辑版本并列</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><path d="M0 20h250l44 44v256h-294Z" fill="#FFFEF9" stroke="#202622" stroke-width="3"/><path d="M250 20v44h44" fill="none" stroke="#202622" stroke-width="2"/><text x="22" y="107" fill="#202622" font-size="30" font-weight="700" text-anchor="start" >写入前</text><text x="22" y="169" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >旧内容</text><text x="22" y="214" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >before</text><path d="M329 20h250l44 44v256h-294Z" fill="#FFFEF9" stroke="#28614D" stroke-width="3"/><path d="M579 20v44h44" fill="none" stroke="#28614D" stroke-width="2"/><text x="351" y="107" fill="#28614D" font-size="30" font-weight="700" text-anchor="start" >写入后</text><text x="351" y="169" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >工具留下的版本</text><text x="351" y="214" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >after</text><path d="M658 20h250l44 44v256h-294Z" fill="#FFFEF9" stroke="#B53830" stroke-width="3"/><path d="M908 20v44h44" fill="none" stroke="#B53830" stroke-width="2"/><text x="680" y="107" fill="#B53830" font-size="30" font-weight="700" text-anchor="start" >现在</text><text x="680" y="169" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >人工又改过</text><text x="680" y="214" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >current</text><path d="M0 397h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><rect x="0" y="431" width="952" height="181" rx="10" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="474" fill="#AEBFAF" font-size="25" font-weight="500" text-anchor="start" >已有检查入口</text><path d="M24 493h904" fill="none" stroke="#596057" stroke-width="3" stroke-linecap="round"  /><text x="24" y="539" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">/diff &lt;checkpoint-id&gt;</text><text x="24" y="588" fill="#F4F1EA" font-size="29" font-weight="400" text-anchor="start" class="mono">/recover &lt;checkpoint-id&gt;</text><text x="0" y="665" fill="#B53830" font-size="30" font-weight="700" text-anchor="start" >继续前重新读取；不覆盖较新的人工修改。</text></svg><p class="explain" data-block data-prose>文件相同只说明当前内容一致，不能证明旧工具一定成功。Checkpoint 不覆盖任意 shell 和外部系统。</p></div></main></body></html>
