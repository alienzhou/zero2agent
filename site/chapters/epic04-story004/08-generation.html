<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>同一份版本，一起保存事实与控制状态</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="08"><header class="page-header"><span>Zero2Agent · 07 · 复用完整快照</span><span class="page-number">08</span></header><div class="heading" data-block><h1>同一份版本，<br>一起保存事实与控制状态</h1><p class="deck" data-prose>减少多份存储之间“这一份新、那一份旧”的组合。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="同一快照包含原史、摘要边界、引用来源和恢复控制；发布顺序"><title>同一快照包含原史、摘要边界、引用来源和恢复控制；发布顺序</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="72" rx="0" fill="#202622" stroke="none" stroke-width="2"/><text x="24" y="48" fill="#F4F1EA" font-size="33" font-weight="700" text-anchor="start" >session / revision N</text><text x="24" y="145" fill="#202622" font-size="32" font-weight="700" text-anchor="start" >原始消息</text><text x="365" y="145" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >调用与结果配对</text><path d="M0 181h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="24" y="243" fill="#202622" font-size="32" font-weight="700" text-anchor="start" >摘要与边界</text><text x="365" y="243" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >只保留已采用版本</text><path d="M0 279h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="24" y="341" fill="#202622" font-size="32" font-weight="700" text-anchor="start" >结果及来源目录</text><text x="365" y="341" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >本机正文引用与读取权限</text><path d="M0 377h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="24" y="439" fill="#202622" font-size="32" font-weight="700" text-anchor="start" >恢复控制状态</text><text x="365" y="439" fill="#202622" font-size="28" font-weight="400" text-anchor="start" >工具状态、未解决检查、预算证据</text><path d="M0 475h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="583" fill="#28614D" font-size="31" font-weight="700" text-anchor="start" >写临时文件 → fsync → 独占发布新版本</text><text x="0" y="640" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >两个写入者争同一版本，只能有一个成功。</text></svg><p class="explain" data-block data-prose>含恢复状态的会话升级为 version=2，旧程序明确拒绝读取。完整快照容易校验，但增加写入和占用；首版限定容量，不自动清理。</p></div></main></body></html>
