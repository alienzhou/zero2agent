="400" text-anchor="start" >没有 finally 收尾</text><text x="557" y="173" fill="#B53830" font-size="29" font-weight="400" text-anchor="start" >内存直接消失</text><path d="M225 245V335H720V385" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><rect x="0" y="417" width="952" height="207" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="25" y="479" fill="#28614D" font-size="34" font-weight="700" text-anchor="start" >进程 B：装载执行记录，明确续跑</text><text x="25" y="542" fill="#202622" font-size="29" font-weight="400" text-anchor="start" >检查 first 没有重复写，second 完成一次。</text><text x="25" y="595" fill="#596057" font-size="28" font-weight="400" text-anchor="start" >断电与网络文件系统仍需另做验证。</text></svg><p class="explain" data-block data-prose>故障注入覆盖完整响应、执行标记、实际写入之后，以及回执保存之后。检查实际文件与效果次数。</p></div></main></body></html>
