<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>一次重启，不能把“未完成”变成完成</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="11"><header class="page-header"><span>Zero2Agent · 10 · 接住前面三课</span><span class="page-number">11</span></header><div class="heading" data-block><h1>一次重启，<br>不能把“未完成”变成完成</h1><p class="deck" data-prose>恢复保留控制状态；明确续跑才开启新一轮预算。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="预算、读取和产物三条控制状态"><title>预算、读取和产物三条控制状态</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="58" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >运行预算</text><text x="0" y="121" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >保存旧轮计数和停止原因</text><text x="0" y="174" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >新一轮由用户明确开启</text><path d="M0 200h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="270" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >未解决读取</text><text x="0" y="333" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >原引用仍在，已用纠错机会不增加</text><text x="0" y="386" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >模型说完成不能清除 pending</text><path d="M0 412h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="482" fill="#B53830" font-size="36" font-weight="700" text-anchor="start" >显式产物契约</text><text x="0" y="545" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >继续校验原先要求的实际文件</text><text x="0" y="598" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >已经用过的修复机会不会重置</text><path d="M0 624h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /></svg><p class="explain" data-block data-prose>计数只覆盖最近持久化边界，崩溃间隙可能还有请求消耗。没有把缺失用量当作零，也没有宣称接续旧预算。</p></div></main></body></html>
