="92" y="304" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >实际写文件</text><text x="92" y="346" fill="#B53830" font-size="29" font-weight="400" text-anchor="start" >文件可能已经改变</text><circle cx="40" cy="425" r="10" fill="#28614D"/><text x="92" y="422" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >保存真实回执</text><text x="92" y="464" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >工具结算结果可以恢复</text><circle cx="40" cy="543" r="10" fill="#28614D"/><text x="92" y="540" fill="#202622" font-size="33" font-weight="700" text-anchor="start" >保存整轮会话</text><text x="92" y="582" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >清除运行中的 pending</text></svg><p class="explain" data-block data-prose>执行标记写入之后、工具真正调用之前也存在窗口。此时只看到标记，没有结果，仍要保守报告未知。</p></div></main></body></html>
