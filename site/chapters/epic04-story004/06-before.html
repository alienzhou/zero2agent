<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>保存失败时，新的副作用必须停下来</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="06"><header class="page-header"><span>Zero2Agent · 05 · 先保存，再执行</span><span class="page-number">06</span></header><div class="heading" data-block><h1>保存失败时，<br>新的副作用必须停下来</h1><p class="deck" data-prose>持久化是等待完成的控制接口。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="权限授权、发布执行快照、文件保护、工具调用的流程"><title>权限授权、发布执行快照、文件保护、工具调用的流程</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="456" height="196" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="22" y="65" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >当前权限批准</text><text x="22" y="128" fill="#596057" font-size="25" font-weight="400" text-anchor="start" >不沿用昨天的许可</text><rect x="496" y="0" width="456" height="196" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="518" y="65" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >执行快照发布</text><text x="518" y="128" fill="#596057" font-size="25" font-weight="400" text-anchor="start" >等待写入、fsync、独占发布</text><rect x="0" y="296" width="456" height="196" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="22" y="361" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >文件 Checkpoint</text><text x="22" y="424" fill="#596057" font-size="25" font-weight="400" text-anchor="start" >捕获受保护路径的原状态</text><rect x="496" y="296" width="456" height="196" rx="0" fill="#FFFEF9" stroke="#C9CDC2" stroke-width="2"/><text x="518" y="361" fill="#202622" font-size="34" font-weight="700" text-anchor="start" >工具执行</text><text x="518" y="424" fill="#596057" font-size="25" font-weight="400" text-anchor="start" >只有前面的步骤完成才开始</text><path d="M470 100H482" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><path d="M724 212V260H228V283" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><path d="M470 396H482" fill="none" stroke="#28614D" stroke-width="3" stroke-linecap="round" marker-end="url(#green)" /><text x="0" y="620" fill="#B53830" font-size="32" font-weight="700" text-anchor="start" >任一前置保存失败 → 停止后续工具和请求</text></svg><p class="explain" data-block data-prose>展示通知可能丢失或失败，因此不能承担保存前置条件。保存失败也不会撤销此前已经完成的效果。</p></div></main></body></html>
