<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>未执行、已结算、未知，不要混成一个“失败”</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="04"><header class="page-header"><span>Zero2Agent · 03 · 三种恢复状态</span><span class="page-number">04</span></header><div class="heading" data-block><h1>未执行、已结算、未知，<br>不要混成一个“失败”</h1><p class="deck" data-prose>恢复判断来自持久记录，不能来自模型的完成声明。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="三个恢复状态及依据"><title>三个恢复状态及依据</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><rect x="0" y="0" width="952" height="177" rx="0" fill="#E0EBDF" stroke="none" stroke-width="2"/><text x="24" y="52" fill="#28614D" font-size="38" font-weight="700" text-anchor="start" >未执行</text><text x="300" y="52" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >没有进入执行边界</text><text x="300" y="113" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >可证明本次调用未启动</text><rect x="0" y="204" width="952" height="177" rx="0" fill="#FFFEF9" stroke="none" stroke-width="2"/><text x="24" y="256" fill="#202622" font-size="38" font-weight="700" text-anchor="start" >已结算</text><text x="300" y="256" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >真实回执已完整发布</text><text x="300" y="317" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >保留成功或错误结果</text><rect x="0" y="408" width="952" height="177" rx="0" fill="#F2DED7" stroke="none" stroke-width="2"/><text x="24" y="460" fill="#B53830" font-size="38" font-weight="700" text-anchor="start" >效果未知</text><text x="300" y="460" fill="#202622" font-size="31" font-weight="400" text-anchor="start" >进入执行边界，缺回执</text><text x="300" y="521" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >核对文件、进程和外部效果</text></svg><p class="explain" data-block data-prose>已结算包括工具返回错误。效果未知时不能伪造成功，也不能按“没执行”重跑。</p></div></main></body></html>
