<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1080"><title>容量满或数据损坏，必须明确停下来</title><link rel="stylesheet" href="course.css"></head><body><main class="sheet " data-page="13"><header class="page-header"><span>Zero2Agent · 12 · 保存失败也是任务状态</span><span class="page-number">13</span></header><div class="heading" data-block><h1>容量满或数据损坏，<br>必须明确停下来</h1><p class="deck" data-prose>不能为了继续工作，悄悄丢掉尚未核对的记录。</p></div><div class="content"><svg class="diagram" viewBox="0 0 952 680" width="952" height="680" role="img" aria-label="容量和错误处理表"><title>容量和错误处理表</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202622"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#28614D"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B53830"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#896016"/></marker></defs><text x="0" y="64" fill="#202622" font-size="31" font-weight="700" text-anchor="start" >单份快照</text><text x="459" y="64" fill="#28614D" font-size="28" font-weight="400" text-anchor="start" >32 MiB 上限</text><path d="M0 104h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="175" fill="#202622" font-size="31" font-weight="700" text-anchor="start" >单会话已发布版本</text><text x="459" y="175" fill="#28614D" font-size="28" font-weight="400" text-anchor="start" >512 MiB / 2048 份上限</text><path d="M0 215h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="286" fill="#202622" font-size="31" font-weight="700" text-anchor="start" >最高版本损坏</text><text x="459" y="286" fill="#B53830" font-size="28" font-weight="400" text-anchor="start" >报错，不偷偷退回较旧版本</text><path d="M0 326h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="397" fill="#202622" font-size="31" font-weight="700" text-anchor="start" >并发保存冲突</text><text x="459" y="397" fill="#B53830" font-size="28" font-weight="400" text-anchor="start" >保留内存，不覆盖另一写入者</text><path d="M0 437h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="508" fill="#202622" font-size="31" font-weight="700" text-anchor="start" >旧进程仍在运行</text><text x="459" y="508" fill="#B53830" font-size="28" font-weight="400" text-anchor="start" >拒绝抢占，先处理原运行</text><path d="M0 548h952" fill="none" stroke="#C9CDC2" stroke-width="3" stroke-linecap="round"  /><text x="0" y="653" fill="#596057" font-size="29" font-weight="400" text-anchor="start" >私有目录权限只提供本地保护，不等于加密。</text></svg><p class="explain" data-block data-prose>首版不自动删除恢复记录。结果正文仍有独立生命周期，过期或丢失会明确失败；恢复保证不等于永久保存正文。</p></div></main></body></html>
