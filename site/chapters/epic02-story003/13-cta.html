<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=1080">
  <meta charset="UTF-8">
  <style>
    body { background: #1A1A1A; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
    .serif { font-family: 'Georgia', 'Songti SC', 'Noto Serif CJK SC', serif; }
    .page { width: 1080px; height: 1440px; background: #1A1A1A; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
    .doc { width: 960px; height: 1300px; padding: 80px; display: flex; flex-direction: column; box-sizing: border-box; justify-content: center; }
    .cta-box { width: 100%; border: 2px solid rgba(211,47,47,0.3); padding: 84px 54px; display: flex; flex-direction: column; align-items: center; text-align: center; box-sizing: border-box; }
    .quote-mark { font-size: 80px; color: #D32F2F; line-height: 0.5; margin-bottom: 20px; font-family: Georgia, serif; }
    .cta-title { font-size: 50px; font-weight: 900; color: #F4F1EA; margin-bottom: 30px; letter-spacing: 1px; line-height: 1.3; }
    .cta-title span { color: #D32F2F; }
    .cta-desc { font-size: 28px; color: #B8B8B8; line-height: 1.65; margin-bottom: 44px; max-width: 88%; }
    .action-badge { background: #D32F2F; color: #FFF; font-size: 26px; font-weight: bold; padding: 18px 40px; border-radius: 8px; transform: rotate(-2deg); }
    .github-link { margin-top: 44px; font-family: ui-monospace, monospace; color: #F4F1EA; font-size: 24px; border-bottom: 2px dashed #666; padding-bottom: 6px; }
    .footer { position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; font-family: ui-monospace, monospace; color: #666; font-size: 22px; }
  </style>
</head>
<body>
<div class="page">
  <div class="doc">
    <div class="cta-box">
      <div class="quote-mark">"</div>
      <div class="cta-title serif">这门课，<span>完全免费开源</span></div>
      <div class="cta-desc">terminal 工具要处理：返回什么字、输出太长怎么办、跑太久怎么办、环境怎么设、后台进程怎么办。代码开源，可以跟着从零写。</div>
      <div class="action-badge">/ 欢迎一起学</div>
      <div class="github-link">alienzhou/zero2agent</div>
    </div>
    <div class="footer">下一课 Story 004：需要人输入的命令</div>
  </div>
</div>
</body>
</html>
