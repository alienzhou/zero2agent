    <div class="title serif">上一课<br>Agent 有什么工具</div>
    <div class="subtitle">能读文件，也能改文件</div>
    <div class="content prose">
      <p class="lead">这一课之前，我们给 Agent 做了 7 个工具。<em>它们都只操作工作区里的文件</em>。</p>
      <p class="p">Epic 1：读文件、列目录、搜内容、搜文件名。Agent 能看项目，但不能改文件。</p>
      <p class="p">Epic 2 前两课：写文件、删文件、改文件里的一小段。到这里，Agent 能读也能改。</p>
      <div class="callout">还缺一件事：改完代码，它<b>不能自己跑 <span class="code">npm test</span></b>，不知道测试有没有过。</div>
