# Include this server block from nginx's http context.
# Replace server_name and root with your domain and deployment directory.
server {
    listen 80;
    server_name zero2agent.example.com;
    root /var/www/zero2agent;
    index index.html;
    charset utf-8;
    include /etc/nginx/mime.types;

    location / {
        try_files $uri $uri/ =404;
    }
}
